<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architektura počítačů a základy OS — interaktivní opakování</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1a56db;--blue-h:#1d4ed8;--blue-50:#eff6ff;--blue-100:#dbeafe;--blue-200:#bfdbfe;--blue-dark:#1e40af;--blue-text:#042c53;
  --bg:#f0f4ff;--white:#fff;--text:#111827;--sec:#6b7280;--hint:#9ca3af;
  --border:#dbeafe;--border2:#bfdbfe;
  --green-bg:#f0fdf4;--green-b:#bbf7d0;--green-t:#14532d;--green-m:#16a34a;
  --amber-bg:#fffbeb;--amber-b:#fde68a;--amber-t:#78350f;--amber-m:#d97706;
  --red-bg:#fef2f2;--red-b:#fecaca;--red-t:#991b1b;--red-m:#dc2626;
  --purple-bg:#faf5ff;--purple-t:#5b21b6;
  --r:8px;--rl:12px;--rxl:14px;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding:1.5rem 1rem}
.page{max-width:740px;margin:0 auto}

/* HEADER */
.hdr{background:var(--blue);border-radius:var(--rxl);padding:1.25rem 1.5rem;margin-bottom:1rem;display:flex;align-items:center;gap:14px}
.hdr-icon{width:42px;height:42px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-icon svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hdr h1{font-size:16px;font-weight:600;color:#fff;margin-bottom:2px}
.hdr p{font-size:12px;color:rgba(255,255,255,.7)}
.hdr-btn{background:rgba(255,255,255,.12);border:none;border-radius:8px;padding:7px 10px;cursor:pointer;color:#fff;font-size:11px;font-weight:500;font-family:inherit;white-space:nowrap;flex-shrink:0;transition:background .15s}
.hdr-btn:hover{background:rgba(255,255,255,.22)}

/* PROGRESS */
.prog{background:var(--white);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1rem;border:1px solid var(--border)}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prog-lbl{font-size:11px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.06em}
.prog-pct{font-size:12px;font-weight:600;color:var(--blue)}
.prog-track{height:6px;background:var(--blue-100);border-radius:3px;overflow:hidden;margin-bottom:10px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),#3b82f6);border-radius:3px;transition:width .5s ease}
.snav{display:flex;gap:5px;flex-wrap:wrap}
.sb{padding:4px 10px;font-size:11px;font-weight:500;border-radius:20px;border:1px solid var(--border);background:var(--white);color:var(--sec);cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
.sb:hover:not([disabled]){background:var(--blue-50);color:var(--blue-dark)}
.sb.done{background:var(--blue-50);color:var(--blue-dark);border-color:var(--blue-200)}
.sb.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.sb[disabled]{opacity:.35;cursor:default}

/* LESSON CARD */
.lcard{background:var(--white);border-radius:var(--rxl);overflow:hidden;border:1px solid var(--border);margin-bottom:1rem;box-shadow:0 1px 3px rgba(26,86,219,.06)}
.lhead{padding:1.25rem 1.5rem 1rem;border-bottom:1px solid var(--blue-50)}
.lbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:.625rem}
.lbadge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.b-data{background:var(--blue-50);color:var(--blue-dark)}
.b-arch{background:var(--green-bg);color:#166534}
.b-hw{background:var(--purple-bg);color:var(--purple-t)}
.b-bus{background:var(--amber-bg);color:#92400e}
.b-mem{background:var(--blue-50);color:var(--blue-dark)}
.b-per{background:var(--green-bg);color:#166534}
.b-mob{background:var(--purple-bg);color:var(--purple-t)}
.b-os{background:var(--amber-bg);color:#92400e}
.b-wl{background:var(--blue-50);color:var(--blue-dark)}
.b-sec{background:var(--red-bg);color:#9f1239}
.b-quiz{background:#fdf4ff;color:#6b21a8}
.ltitle{font-size:19px;font-weight:700;color:var(--text);margin-bottom:3px;line-height:1.3}
.lsub{font-size:13px;color:var(--sec)}
.lmeta{display:flex;gap:12px;flex-wrap:wrap;margin-top:.625rem;font-size:11px;color:var(--hint)}
.lbody{padding:1.25rem 1.5rem}

/* CONTENT */
.sechead{display:flex;align-items:baseline;gap:8px;margin:1.5rem 0 .625rem;padding-top:1rem;border-top:1px solid var(--blue-50)}
.sechead:first-child{margin-top:0;padding-top:0;border-top:none}
.sechead .n{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.06em;background:var(--blue-50);padding:2px 7px;border-radius:5px;flex-shrink:0}
.sechead h3{font-size:15px;font-weight:700;color:var(--text);line-height:1.3}
.txt{font-size:14px;line-height:1.75;margin-bottom:1rem;color:var(--text)}
.txt p{margin-bottom:.75rem}.txt p:last-child{margin:0}
.txt strong{font-weight:600;color:var(--blue-dark)}
.txt code{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;font-size:.9em;background:var(--blue-50);padding:1px 5px;border-radius:4px;color:var(--blue-dark)}
.txt sup{font-size:.7em}

.hl{border-radius:10px;padding:.75rem 1rem;margin-bottom:1rem;font-size:13px;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.hl-icon{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.hl strong{font-weight:600}
.hl code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:rgba(255,255,255,.6);padding:1px 4px;border-radius:3px}
.hl-blue{background:var(--blue-50);color:var(--blue-text);border:1px solid var(--blue-200)}
.hl-green{background:var(--green-bg);color:var(--green-t);border:1px solid var(--green-b)}
.hl-amber{background:var(--amber-bg);color:var(--amber-t);border:1px solid var(--amber-b)}
.hl-red{background:var(--red-bg);color:var(--red-t);border:1px solid var(--red-b)}

.info-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:1rem;border-radius:var(--r);overflow:hidden}
.info-table th{background:var(--blue-50);padding:8px 12px;text-align:left;font-weight:600;font-size:11px;color:var(--blue-dark);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
.info-table td{padding:8px 12px;border-bottom:1px solid var(--blue-50);color:var(--text);line-height:1.55;vertical-align:top}
.info-table td:first-child{font-weight:600;white-space:nowrap}
.info-table tr:last-child td{border-bottom:none}
.info-table tr:nth-child(even) td{background:var(--blue-50)}
@media(max-width:560px){
  .info-table td:first-child{white-space:normal}
  .info-table td,.info-table th{padding:7px 9px;font-size:12px}
}

.def-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-bottom:1rem}
.def-card{background:var(--blue-50);border:1px solid var(--border);border-radius:var(--r);padding:.75rem}
.def-term{font-size:10px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.def-val{font-size:13px;line-height:1.5;color:var(--text)}

.slabel{font-size:11px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.5rem}

/* SIM / WIDGET BLOCK */
.sim{background:var(--blue-50);border:1px solid var(--border);border-radius:var(--rl);padding:1rem;margin-bottom:1rem}
.sim-t{font-size:13px;font-weight:700;color:var(--blue-dark);margin-bottom:2px}
.sim-h{font-size:12px;color:var(--sec);margin-bottom:.75rem;line-height:1.5}
.status-bar{font-size:13px;color:var(--sec);padding:.5rem .875rem;background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.75rem;min-height:36px;line-height:1.5}
.status-bar strong{color:var(--blue-dark)}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.75rem}
.brow:last-child{margin-bottom:0}
.btn{padding:8px 16px;font-size:13px;font-weight:500;border-radius:var(--r);cursor:pointer;transition:all .15s;font-family:inherit}
.btn-p{background:var(--blue);color:#fff;border:none}.btn-p:hover{background:var(--blue-h)}.btn-p:disabled{opacity:.4;cursor:default}
.btn-d{background:#fff;color:var(--red-m);border:1px solid var(--red-b)}.btn-d:hover{background:var(--red-bg)}
.btn-ok{background:#fff;color:var(--green-m);border:1px solid var(--green-b)}.btn-ok:hover{background:var(--green-bg)}
.btn-g{background:#fff;color:var(--text);border:1px solid var(--border2)}.btn-g:hover{background:var(--blue-50)}.btn-g:disabled{opacity:.35;cursor:default}
.btn-s{padding:6px 12px;font-size:12px}

.fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:.75rem}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:10px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld select{font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--r);background:#fff;color:var(--text);width:140px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
@media(max-width:560px){.fld input,.fld select{width:118px}}

.rd{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:7px;margin-bottom:.75rem}
.rd-c{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;text-align:center}
.rd-k{font-size:9.5px;font-weight:700;color:var(--sec);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.rd-v{font-family:ui-monospace,Consolas,monospace;font-size:17px;font-weight:700;color:var(--blue);word-break:break-all;line-height:1.25}
.rd-v.sm{font-size:13px}

.log-box{font-size:11.5px;font-family:ui-monospace,Consolas,monospace;max-height:150px;overflow-y:auto;padding:6px 10px;background:#fff;border:1px solid var(--border);border-radius:var(--r);margin-bottom:.75rem}
.lg{padding:2.5px 0;border-bottom:1px solid var(--blue-50);display:flex;justify-content:space-between;gap:10px}
.lg:last-child{border:none}
.lg.ok{color:var(--green-m)}.lg.err{color:var(--red-m)}.lg.info{color:var(--blue)}.lg.warn{color:var(--amber-m)}
.lg em{font-style:normal;font-weight:700;color:var(--green-m)}
.res{padding:9px 12px;background:var(--green-bg);border:1px solid var(--green-b);border-radius:var(--r);font-family:ui-monospace,Consolas,monospace;font-size:13px;font-weight:700;color:var(--green-t);text-align:center;word-break:break-all;margin-bottom:.75rem}
.empty{color:var(--hint);font-size:12px;font-style:italic;padding:6px 2px}

/* CANVAS */
.cvs-wrap{border-radius:var(--rl);overflow:hidden;border:1px solid var(--border);background:#fff;margin-bottom:.75rem}
.cvs-wrap canvas{width:100%;display:block}
.cvs-hint{font-size:11px;color:var(--hint);text-align:center;padding:5px 8px 7px;line-height:1.4}

/* PILLS / TOGGLES */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem}
.pill{padding:5px 14px;font-size:12px;font-weight:500;border-radius:20px;border:1px solid var(--border2);background:#fff;cursor:pointer;font-family:inherit;color:var(--sec);transition:all .15s}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pill:hover:not(.on){background:var(--blue-50);color:var(--blue-dark)}

/* STEP PILLS + EXPL */
.spills{display:flex;gap:4px;margin-bottom:.75rem}
.sp{flex:1;height:4px;border-radius:2px;background:var(--blue-100);transition:background .3s}
.sp.done{background:var(--blue-200)}.sp.on{background:var(--blue)}
.expl-card{border:1px solid var(--border);border-radius:var(--rl);padding:.875rem 1rem;margin-bottom:.75rem;background:#fff;min-height:96px}
.expl-num{font-size:10px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.expl-title{font-size:14px;font-weight:700;margin-bottom:5px;color:var(--text)}
.expl-desc{font-size:13px;line-height:1.6;color:var(--sec)}

/* BITS */
.bits{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:.75rem}
.bit{width:48px;background:#fff;border:2px solid var(--border2);border-radius:var(--r);padding:6px 0 5px;cursor:pointer;font-family:inherit;text-align:center;transition:all .15s}
.bit:hover{border-color:var(--blue)}
.bit .d{display:block;font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:22px;line-height:1;color:var(--hint)}
.bit .p{display:block;font-family:ui-monospace,Consolas,monospace;font-size:9px;color:var(--sec);margin-top:4px}
.bit.on{border-color:var(--blue);background:var(--blue-50)}
.bit.on .d{color:var(--blue)}
.bit.on .p{color:var(--blue-dark);font-weight:700}
@media(max-width:560px){.bit{width:38px}.bit .d{font-size:18px}.bit .p{font-size:8px}}

.brow-c{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.bc{width:32px;height:36px;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:16px;border:1px solid var(--border2);border-radius:6px;background:#fff;color:var(--blue-dark)}
.bc.flip{background:var(--amber-bg);border-color:var(--amber-b);color:var(--amber-t)}
.bc.sign{background:var(--blue);border-color:var(--blue);color:#fff}
.stage{margin-bottom:.625rem}
.stage-l{font-size:11px;font-weight:600;color:var(--sec);margin-bottom:4px;text-align:center}

/* PYRAMID */
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:.75rem}
.pyr-l{border:1px solid var(--border2);background:#fff;border-radius:6px;padding:7px 12px;text-align:center;cursor:pointer;transition:all .15s;font-family:inherit;font-weight:600;font-size:12.5px;color:var(--text)}
.pyr-l:hover{border-color:var(--blue)}
.pyr-l.on{border-color:var(--blue);background:var(--blue);color:#fff}
.pyr-ax{display:flex;justify-content:space-between;font-size:10px;color:var(--hint);max-width:400px;margin:0 auto 8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* BARS */
.bars{display:flex;flex-direction:column;gap:6px}
.bar-r{display:grid;grid-template-columns:104px 1fr;gap:9px;align-items:center;font-size:12px}
.bar-r .nm{font-family:ui-monospace,Consolas,monospace;color:var(--sec);text-align:right;font-size:11px}
.bar-t{background:var(--blue-100);border-radius:4px;height:22px;overflow:hidden}
.bar-f{height:100%;background:linear-gradient(90deg,#3b82f6,var(--blue));border-radius:4px;width:0;transition:width .8s cubic-bezier(.3,0,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:11px;white-space:nowrap}
.bar-r.hi .bar-f{background:linear-gradient(90deg,#4ade80,var(--green-m))}
@media(max-width:560px){.bar-r{grid-template-columns:76px 1fr}.bar-r .nm{font-size:10px}}

/* TASKS */
.task{border:1px solid var(--border);border-radius:var(--rl);padding:.875rem 1rem;margin-bottom:.625rem;background:#fff}
.task-q{font-size:13.5px;line-height:1.65;margin-bottom:.625rem;color:var(--text)}
.task-q b{color:var(--blue-dark)}
.task-sol{margin-top:.75rem;padding:.75rem .875rem;background:var(--green-bg);border:1px solid var(--green-b);border-radius:var(--r);font-size:13px;line-height:1.65;color:var(--green-t)}
.task-sol p{margin-bottom:.5rem}.task-sol p:last-child{margin-bottom:0}
.task-sol b{font-weight:700}

/* RECAP */
.recap-list{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:1rem}
.recap-list li{display:flex;gap:9px;font-size:13px;line-height:1.6;align-items:flex-start;background:var(--blue-50);border:1px solid var(--border);border-radius:var(--r);padding:.625rem .875rem}
.recap-list li::before{content:'✓';color:var(--blue);font-weight:700;flex-shrink:0}
.recap-list b{font-weight:600;color:var(--blue-dark)}

/* QUIZ */
.q-prog-wrap{height:4px;background:var(--blue-100);border-radius:2px;margin-bottom:1.25rem;overflow:hidden}
.q-prog{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}
.q-meta{font-size:11px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;justify-content:space-between}
.q-meta .ch{color:var(--hint);font-weight:500;text-transform:none;letter-spacing:0}
.q-text{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:1rem;color:var(--text)}
.q-opts{display:flex;flex-direction:column;gap:7px;margin-bottom:.875rem}
.q-opt{padding:10px 14px;border:1px solid var(--border2);border-radius:var(--r);cursor:pointer;font-size:13px;font-family:inherit;background:#fff;color:var(--text);text-align:left;transition:all .1s;line-height:1.4}
.q-opt:hover:not([disabled]){background:var(--blue-50);border-color:var(--blue-200)}
.q-opt.correct{background:var(--green-bg);border-color:var(--green-m);color:var(--green-t)}
.q-opt.wrong{background:var(--red-bg);border-color:var(--red-m);color:var(--red-t)}
.q-opt[disabled]{cursor:default}
.q-exp{font-size:13px;color:var(--blue-dark);line-height:1.6;padding:10px 14px;background:var(--blue-50);border-radius:var(--r);margin-bottom:.875rem;border-left:3px solid var(--blue)}
.q-txt-in{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.875rem}
.q-txt-in input{font-family:ui-monospace,Consolas,monospace;font-size:14px;padding:9px 12px;border:1px solid var(--border2);border-radius:var(--r);width:180px}
.q-txt-in input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.qdot{width:10px;height:10px;border-radius:50%;background:var(--blue-100);display:inline-block}
.qdot.ok{background:var(--green-m)}.qdot.bad{background:var(--red-m)}

/* LESSON NAV */
.lnav{display:flex;justify-content:space-between;align-items:center;padding:.875rem 1.5rem;border-top:1px solid var(--blue-50);background:var(--blue-50);gap:10px}
.lnav-pos{font-size:12px;color:var(--hint);white-space:nowrap}

/* COMPLETE */
.complete{text-align:center;padding:2rem 1rem}
.complete-star{font-size:52px;margin-bottom:.75rem;line-height:1;color:var(--blue)}
.complete-title{font-size:22px;font-weight:700;margin-bottom:.5rem}
.complete-score{font-size:40px;font-weight:700;color:var(--blue);margin-bottom:.5rem}
.complete-sub{font-size:14px;color:var(--sec);max-width:420px;margin:0 auto 1.5rem;line-height:1.65}

@media print{
  body{background:#fff;padding:0}
  .hdr,.prog,.lnav,.brow,.fields,.pills,.btn,.hdr-btn{display:none!important}
  .lcard{border:none;box-shadow:none;margin:0}
  .task-sol{display:block!important}
  .sim{background:#fff;break-inside:avoid}
  .info-table,.task,.hl{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001ms!important;animation-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="page">

<div id="toast" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.18);transition:opacity .3s"></div>

<div class="hdr">
  <div class="hdr-icon">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="2" x2="9" y2="4"/><line x1="15" y1="2" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="22"/><line x1="15" y1="20" x2="15" y2="22"/><line x1="20" y1="9" x2="22" y2="9"/><line x1="20" y1="14" x2="22" y2="14"/><line x1="2" y1="9" x2="4" y2="9"/><line x1="2" y1="14" x2="4" y2="14"/></svg>
  </div>
  <div style="flex:1">
    <h1>Architektura počítačů a základy OS</h1>
    <p>Interaktivní opakování ke kurzu — 10 kapitol, asi 2,5 hodiny</p>
  </div>
  <button class="hdr-btn" onclick="confirmReset()" title="Resetovat postup">↺ Reset</button>

  {t:'Data a informace', html:`
   <p><strong>Data</strong> jsou surové údaje. <strong>Informace</strong> vzniká až jejich výkladem: „auto" a „červená" jsou data, „auto je červené" je informace.</p>
   <p>Počítač pracuje výhradně s daty. Význam jim dává až člověk, který je čte — proto stejná posloupnost bitů může být jednou obrázek a jindy hudba, podle toho, jakým programem ji otevřete.</p>`,

  {t:'Bit a bajt', html:`
   <p>Obvod spolehlivě rozliší dva stavy: napětí je, nebo není. Proto dvojková soustava. Jedna číslice je <strong>bit</strong> (malé b), osm bitů tvoří <strong>bajt</strong> (velké B).</p>
   <p>Bity v bajtu mají zprava doleva váhy 1, 2, 4, 8, 16, 32, 64, 128. Hodnota je součet zapnutých vah. Obecně platí, že <strong>n bitů</strong> pojme <strong>2<sup>n</sup></strong> různých hodnot.</p>`,

  {t:'Číselné soustavy', html:`
   <p>Desítková (0–9) pro lidi, dvojková (0–1) pro počítač, šestnáctková (0–9, A–F) pro zkrácený zápis — barvy <code>#FF1245</code>, MAC adresy, chybové kódy.</p>
   <p>Šestnáctková soustava je oblíbená proto, že jedna její číslice zastoupí přesně čtyři bity. Celý bajt se tak zapíše dvěma znaky místo osmi.</p>`,

  {t:'Jednotky a předpony', html:`
   <p>Existují dvě řady předpon. <strong>Desítková</strong> (KB, MB, GB) násobí tisícem — používají ji výrobci disků a poskytovatelé internetu. <strong>Dvojková</strong> (KiB, MiB, GiB) násobí 1024 — počítá s ní operační systém.</p>
   <p>Rozdíl se s každým řádem zvětšuje: u kilobajtů jsou to 2,4 %, u terabajtů už skoro 10 %. Odtud pochází věčná otázka, kam se poděl kus nového disku.</p>`,

  {t:'Kódování znaků', html:`
   <p>Aby počítač zvládl text, musí mít každý znak přiřazené číslo. Nejstarší takovou tabulkou je <strong>ASCII</strong> — 128 znaků na sedmi bitech, tedy anglická abeceda, číslice a interpunkce. Na češtinu nezbylo místo.</p>
   <p>Řešením byly národní tabulky (u nás Windows-1250 a ISO-8859-2), které do zbylých 128 míst dosadily háčky a čárky. Jenže každá jinak, takže se text mezi systémy rozsypal.</p>
   <p>Dnes vládne <strong>Unicode</strong> — jediná tabulka pro všechna písma světa, včetně emoji. Nejčastěji se ukládá v kódování <strong>UTF-8</strong>, které běžné znaky zapíše jedním bajtem a méně obvyklé dvěma až čtyřmi.</p>`,

  {t:'Záporná čísla', html:`
   <p>Bity samy znaménko neznají. Postupně vznikly tři způsoby zápisu a vyhrál ten třetí.</p>
   <p><strong>Přímý kód</strong> vyhradí první bit znaménku — jenže pak existují dvě nuly. <strong>Inverzní kód</strong> negoval všechny bity, ale dvě nuly zůstaly. <strong>Doplňkový kód</strong> přidá k negaci jedničku, čímž druhou nulu odstraní a umožní procesoru odčítat stejným obvodem jako sčítat.</p>`,
   lab:'twos', labTitle:'Doplňkový kód po krocích',

  {t:'Když se číslo nevejde', html:`
   <p>Registr má pevnou šířku. Když výsledek přesáhne jeho rozsah, přebytečné bity se nenávratně ztratí a hodnota se překlopí — z nejvyššího čísla rázem vznikne nejnižší. Tomu se říká <strong>přetečení</strong>.</p>
   <p>Zákeřné je, že procesor přitom nehlásí chybu. Prostě počítá dál se špatným číslem, a program se rozbije až o kus dál.</p>
   <p>Slavných následků je celá řada. V arkádové hře Pac-Man se úroveň počítala do jednoho bajtu, takže 256. kolo přeteklo a půlka obrazovky se rozsypala do nesmyslných znaků. Raketa <strong>Ariane 5</strong> se v roce 1996 rozpadla 37 vteřin po startu, protože se šestnáctibitová proměnná nedokázala vyrovnat s rychlostí, na kterou nebyla dimenzovaná. Škoda přesáhla 300 milionů dolarů.</p>`,

 tasks:[
  {q:"Student vám ukáže nový disk s nápisem <b>2 TB</b> a stěžuje si, že Windows hlásí jen 1,81 TB. Tvrdí, že ho výrobce ošidil. Kde je chyba v jeho úvaze a jak byste mu to vysvětlili?",
   s:"<p><b>Nikdo neošidil nikoho.</b> Výrobce počítá v desítkových jednotkách, systém ve dvojkových.</p><p>2 TB podle výrobce znamená 2 × 10¹² = 2 000 000 000 000 bajtů. Windows ale dělí číslem 1024⁴ = 1 099 511 627 776, a tak dostane 1,82 — přičemž jednotku popisuje jako „TB“, ačkoli počítá TiB.</p><p><b>Skutečná chyba je v označení Windows</b>, ne v disku. Kdyby systém psal 1,81 TiB, žádný spor by nevznikl. Zkuste si to spočítat v kalkulačce v sekci o jednotkách — u terabajtů dělá rozdíl skoro 10 %.</p>"},
  {q:"Máte spočítat, jak dlouho potrvá stažení filmu o velikosti <b>4,7 GB</b> po lince <b>250 Mb/s</b>. Kolega tvrdí, že to bude asi 19 sekund, protože 4,7 ÷ 0,25 ≈ 19. Najděte chybu a spočítejte to správně.",
   s:"<p><b>Zaměnil bity za bajty.</b> Velikost souboru je v gigabajtech, rychlost linky v megabitech — mezi nimi je osminásobek.</p><p>Správný postup: 4,7 GB × 8 000 = 37 600 Mb. Poté 37 600 ÷ 250 = <b>150 sekund</b>, tedy dvě a půl minuty.</p><p>Kolegův výsledek je osmkrát menší než skutečnost. Je to nejčastější chyba v celé kapitole a stojí za ní právě to, že se rychlost tradičně udává v bitech, kdežto velikost v bajtech.</p>"},
  {q:"Program ukládá počet návštěvníků do <b>osmibitové proměnné bez znaménka</b>. Po 300 návštěvnících ukazuje hodnotu 44. Vysvětlete, proč, a navrhněte dvě různá řešení.",
   s:"<p><b>Došlo k přetečení.</b> Do osmi bitů se vejde 0 až 255. Při 256. návštěvníkovi se čítač překlopil na nulu a počítal znovu: 300 − 256 = <b>44</b>.</p><p><b>Řešení 1 — širší proměnná.</b> Šestnáct bitů pojme 65 535 návštěvníků, dvaatřicet přes čtyři miliardy. Nejjednodušší a nejběžnější náprava.</p><p><b>Řešení 2 — kontrola před přičtením.</b> Program před každým zvýšením ověří, jestli by se výsledek ještě vešel, a při dosažení stropu ohlásí chybu místo tichého překlopení. To je bezpečnější, protože se chyba pozná hned.</p><p>Právě druhá varianta chyběla u rakety Ariane 5 — proměnná přetekla a řízení dostalo nesmyslnou hodnotu jako by nic.</p>"}

{
 id:2, mins:15, title:'Architektura počítače', sub:'Von Neumann, Harvard a instrukční cyklus',
 blurb:'Jak je počítač uspořádaný uvnitř a proč se to za sedmdesát let skoro nezměnilo.',
 sections:[
  {t:'Von Neumannovo schéma', html:`
   <p>Návrh z roku 1945, podle kterého je postavena drtivá většina dnešních počítačů. Skládá se z pěti částí: <strong>řadič</strong>, <strong>aritmeticko-logická jednotka</strong>, <strong>paměť</strong>, <strong>vstup</strong> a <strong>výstup</strong>.</p>
   <p>Klíčová myšlenka: program i data leží ve <strong>stejné paměti</strong>. Počítač tak nemusí být pro každou úlohu přestavěn — stačí do paměti nahrát jiný program. To je důvod, proč je dnešní počítač univerzální stroj a ne kalkulačka na jednu věc.</p>`,
   facts:{title:'Pět částí a jejich úloha', rows:[
     ['Řadič','čte instrukce, dekóduje je a řídí činnost všech ostatních částí'],
     ['Aritmeticko-logická jednotka','provádí výpočty a logické operace'],
     ['Paměť','drží program i data — u von Neumanna společně'],
     ['Vstup','přivádí data do počítače (klávesnice, disk, síť)'],
     ['Výstup','předává výsledky ven (monitor, tiskárna, disk)'],
     ['Procesor','řadič a ALU dohromady, doplněné o registry a cache']]},
   key:'Program uložený v paměti je ta nejdůležitější myšlenka celého návrhu — díky ní stačí počítač přeprogramovat, ne přestavět.'},

  {t:'Von Neumann versus Harvard', html:`
   <p>Společná paměť má nevýhodu: instrukce i data se tlačí přes jednu sběrnici a musí se střídat. Té frontě se říká <strong>von Neumannovo úzké hrdlo</strong>.</p>
   <p><strong>Harvardská architektura</strong> ho obchází — má oddělenou paměť pro program a pro data, každou s vlastní sběrnicí, takže obojí putuje současně.</p>
   <p>Všimněte si směrů: instrukce se z paměti jen čtou, kdežto data procesor čte i zapisuje. Datová sběrnice proto musí být obousměrná, sběrnice instrukcí ne.</p>`,
   lab:'arch', labTitle:'Podívejte se na rozdíl', labHint:'Přepněte architekturu a sledujte pohyb po sběrnici.',
   facts:{title:'Srovnání obou přístupů', rows:[
     ['Von Neumann','jedna paměť, jedna sběrnice · jednodušší a levnější · přenosy stojí ve frontě'],
     ['Harvard','oddělené paměti i sběrnice · rychlejší · složitější zapojení'],
     ['Modifikovaná harvardská','hlavní paměť společná, ale cache oddělená pro instrukce a data'],
     ['Kde je čistý Harvard','jednočipové mikrokontroléry, signálové procesory'],
     ['Kde je modifikovaná','běžné procesory v počítačích a telefonech']]},
   key:'Dnešní procesory používají <strong>modifikovanou harvardskou architekturu</strong> — zvenčí von Neumann, uvnitř oddělená cache.'},

  {t:'Instrukční cyklus', html:`

   <p>Kolik cyklů se stihne, určuje <strong>taktovací frekvence</strong>. Procesor na 3 GHz zvládne tři miliardy taktů za sekundu — jedna instrukce ovšem obvykle zabere taktů několik.</p>`,
   lab:'cycle', labTitle:'Krok za krokem', labHint:'Projděte cyklus ručně, nebo si ho nechte přehrát.',
   facts:{title:'Co si procesor drží po ruce', rows:[

     ['Registr instrukce','právě načtená instrukce čekající na dekódování'],

     ['Cache','kopie dat z operační paměti, aby se na ni nemuselo čekat'],
     ['Taktovací frekvence','počet taktů za sekundu — 3 GHz jsou tři miliardy'],

  {t:'Propustnost PCIe', html:`

 tasks:[
  {q:"Procesor A má taktovací frekvenci <b>4,2 GHz</b> a čtyři jádra. Procesor B má <b>3,1 GHz</b> a šestnáct jader. Student z toho usoudí, že A je rychlejší, protože má vyšší frekvenci. Za jakých okolností má pravdu a kdy se plete?",
   s:"<p><b>Záleží výhradně na tom, co se na procesoru poběží.</b></p><p><b>A vyhraje</b> u úloh, které se nedají rozdělit — starší hry, jednovláknové výpočty, běžná kancelářská práce. Tam pracuje reálně jen jedno jádro a rozhoduje frekvence.</p><p><b>B vyhraje</b> u úloh, které se rozdělit dají — překlad kódu, export videa, virtuální stroje, servery. Šestnáct pomalejších jader tam snadno přebije čtyři rychlá.</p><p><b>Frekvence se navíc dá porovnávat jen v rámci jedné generace.</b> Roli hraje i to, kolik instrukcí procesor stihne za takt, velikost cache a rychlost paměti. Proto se výkon posuzuje testy, ne čísly z katalogu.</p>"},
  {q:"Proč se čistá harvardská architektura prosadila v jednočipových mikrokontrolérech (třeba v pračce nebo v Arduinu), ale v běžném počítači ne?",
   s:"<p><b>Rozhoduje to, jestli se program mění, nebo ne.</b></p><p>V mikrokontroléru je program pevně daný a při výrobě uložený do paměti jen pro čtení. Oddělit ho od dat je proto přirozené — a přináší to vyšší rychlost i bezpečnost, protože program nejde přepsat.</p><p>Běžný počítač naopak musí umět <b>spustit libovolný program</b>, který se do paměti teprve nahraje ze souboru. Program je tedy pro počítač v okamžiku načítání jen obyčejná data. Ostré oddělení obou pamětí by tenhle základní úkon znemožnilo.</p><p><b>Kompromisem je modifikovaná harvardská architektura:</b> hlavní paměť společná, cache oddělená. Počítač si tak zachová univerzálnost a přesto získá část rychlostní výhody.</p>"}
 ],
 questions:[
  {t:'choice',q:'Čím se harvardská architektura liší od von Neumannovy?',
   o:['Nepoužívá vyrovnávací paměť cache','Má oddělenou paměť a sběrnici pro instrukce a pro data','Ukládá program na disk místo do paměti','Zpracovává instrukce v opačném pořadí'],c:1,
   e:'Oddělené cesty znamenají, že instrukce i data se přenášejí současně. Odpadá tím von Neumannovo úzké hrdlo.'},
  {t:'choice',q:'Které dvě části tvoří dohromady procesor?',
   o:['Paměť a vstup','Řadič a aritmeticko-logická jednotka','Vstup a výstup','Sběrnice a paměť'],c:1,
   e:'Řadič řídí chod počítače, ALU počítá. Doplňují je registry a vyrovnávací paměť cache.'},
  {t:'choice',q:'V jakém pořadí probíhá instrukční cyklus?',
   o:['Dekódování → načtení → uložení → provedení','Načtení → dekódování → provedení → uložení','Provedení → načtení → dekódování → uložení','Uložení → provedení → načtení → dekódování'],c:1,
   e:'Nejdřív se instrukce načte z paměti, pak se rozpozná, provede a nakonec se uloží výsledek.'}
 ],
 recap:[
  '<b>Von Neumannovo schéma:</b> řadič, ALU, paměť, vstup, výstup — a program uložený ve stejné paměti jako data.',
  '<b>Procesor</b> tvoří řadič a ALU, doplněné registry a cache.',
  '<b>Harvardská architektura</b> odděluje paměť programu a dat, takže obojí putuje současně.',
  '<b>Dnešní procesory</b> mají modifikovanou harvardskou architekturu — oddělenou cache, společnou hlavní paměť.',
  '<b>Instrukční cyklus:</b> načtení, dekódování, provedení, uložení výsledku.',
  '<b>Taktovací frekvence</b> udává počet taktů za sekundu, ale sama o sobě o výkonu nerozhoduje.'
 ]
},

{
 id:3, mins:15, title:'Základní části počítače', sub:'Deska, procesor, paměť, disk, grafika, zdroj',
 blurb:'Co je uvnitř skříně a k čemu jednotlivé součástky slouží.',
 sections:[
  {t:'Hardware a software', html:`
   <p><strong>Hardware</strong> je všechno hmatatelné — deska, procesor, disk. <strong>Software</strong> jsou programy, které na tom hardwaru běží. Jedno bez druhého je k ničemu.</p>
   <p>Mezi nimi stojí <strong>firmware</strong> — program uložený přímo v součástce, který ji oživí. Je v základní desce, v disku i v tiskárně.</p>`,
   key:'Základní deska je páteří sestavy: propojuje všechny ostatní části a rozvádí k nim napájení i data.'},

  {t:'Součásti sestavy', html:`
   <p>Každá komponenta má svou roli. Podívejte se, čím se od sebe liší a podle čeho se vybírají.</p>`,
   lab:'parts', labTitle:'Co která součástka dělá', labHint:'Klikněte na komponentu.',
   facts:{title:'Podle čeho se komponenty vybírají', rows:[
     ['Procesor','počet jader, taktovací frekvence, velikost cache, patice, spotřeba TDP'],
     ['Operační paměť','kapacita v GB, generace DDR, frekvence, počet modulů'],
     ['Disk','typ (HDD/SSD), kapacita, rozhraní (SATA/NVMe), rychlost čtení a zápisu'],
     ['Grafická karta','výkon čipu, kapacita a typ paměti, spotřeba, výstupy'],
     ['Základní deska','formát, patice procesoru, čipová sada, počet slotů a konektorů'],
     ['Zdroj','výkon ve wattech s rezervou, potřebné konektory']]},
   key:'Procesor a operační paměť určují svižnost systému, disk rychlost startu a načítání, grafická karta výkon ve hrách a v grafice.'},

  {t:'Základní deska zblízka', html:`
   <p>Deska určuje, co do sestavy vůbec půjde zapojit. <strong>Patice</strong> (socket) rozhoduje o tom, jaké procesory na ni pasují — Intel a AMD mají každý vlastní a nejsou zaměnitelné.</p>
   <p><strong>Čipová sada</strong> řídí komunikaci mezi procesorem, pamětí a periferiemi. Podle ní se pozná, kolik disků a rozšiřujících karet deska unese a jestli dovolí přetaktování.</p>
   <p>Formát desky určuje velikost skříně i počet slotů: <strong>ATX</strong> je plnohodnotný, <strong>microATX</strong> kompromis, <strong>Mini-ITX</strong> nejmenší pro kompaktní sestavy.</p>`,
   facts:{title:'Co na desce najdete', rows:[
     ['Patice (socket)','místo pro procesor — určuje, které modely lze osadit'],
     ['Sloty DIMM','pro moduly operační paměti, obvykle dva nebo čtyři'],
     ['Sloty PCIe','pro grafickou kartu a rozšiřující karty'],
     ['Konektory M.2 a SATA','pro disky'],
     ['Čipová sada','řídí komunikaci mezi procesorem, pamětí a periferiemi'],
     ['Firmware BIOS/UEFI','oživí desku po zapnutí a předá řízení systému']]},
   key:'Při upgradu je patice první, co se kontroluje. Nový procesor na starou desku často nepasuje ani v rámci jednoho výrobce.', keyWarn:true},

  {t:'Napájecí zdroj', html:`
   <p>Zdroj přeměňuje střídavé napětí ze zásuvky na stejnosměrné, které komponenty potřebují, a rozvádí ho konektory k desce, disku i grafické kartě.</p>
   <p>Musí zvládnout součet spotřeby všech součástek a mít rezervu. Počítá se zhruba 40 % navíc — komponenty totiž při krátkých špičkách odeberou víc, než mají v katalogu.</p>`,
   lab:'psu', labTitle:'Jaký zdroj sestava potřebuje', labHint:'Poskládejte sestavu a podívejte se na doporučený výkon.',
   key:'Poddimenzovaný zdroj se projeví nestabilitou pod zátěží — počítač se restartuje zrovna ve chvíli, kdy má nejvíc práce.', keyWarn:true}
 ],
 tasks:[
  {q:"Škola má rozpočet na deset počítačů do učebny informatiky. Budou se na nich používat prohlížeč, kancelářský balík a programování v Pythonu. Do čeho byste peníze dali přednostně a co byste naopak omezili? Zdůvodněte.",
   s:"<p><b>Přednostně:</b></p><p><b>SSD místo pevného disku</b> — největší rozdíl, který žák pozná okamžitě. Start systému i otevírání programů se zkrátí několikanásobně. Kapacita může být malá, data stejně budou na síti.</p><p><b>16 GB operační paměti</b> ve dvou modulech. Prohlížeč s dvaceti panely spolkne víc, než by člověk čekal, a nedostatek paměti se projeví okamžitě.</p><p><b>Kvalitní zdroj a monitor</b> — na obojí se student dívá, respektive obojí rozhoduje o životnosti sestavy.</p><p><b>Naopak omezit:</b></p><p><b>Grafickou kartu.</b> Pro uvedené použití integrovaná grafika bohatě stačí a ušetří se tím podstatná část rozpočtu i spotřeby.</p><p><b>Procesor nejvyšší třídy.</b> Čtyřjádro střední třídy zvládne výuku bez problémů. Rozdíl proti nejdražšímu modelu student nepozná, cenu ale ano.</p>"},
  {q:"Do tříleté sestavy chcete dát nový, výkonnější procesor. Co všechno musíte zkontrolovat, než ho objednáte?",
   s:"<p><b>1. Patici (socket).</b> Musí odpovídat. Intel i AMD mění patice po několika generacích a nový procesor na starou desku často nepasuje ani mechanicky.</p><p><b>2. Podporu čipové sady.</b> I když patice sedí, deska musí konkrétní model podporovat. Někdy stačí aktualizace firmwaru — tu je ale nutné udělat <i>před</i> výměnou, se starým procesorem.</p><p><b>3. Výkon zdroje.</b> Silnější procesor odebere víc. Spočítejte spotřebu sestavy a přidejte rezervu.</p><p><b>4. Chlazení.</b> Vyšší TDP znamená větší chladič. Původní často nestačí.</p><p><b>5. Jestli to má vůbec smysl.</b> U tříleté sestavy bývá lepší investice do SSD nebo paměti — zrychlí běžnou práci víc než nový procesor.</p>"}
 ],
 questions:[
  {t:'choice',q:'Která součást propojuje všechny ostatní části počítače?',
   o:['Procesor','Základní deska','Napájecí zdroj','Operační paměť'],c:1,
   e:'Základní deska nese patici procesoru, sloty pamětí, rozšiřující sloty i konektory a rozvádí mezi ně data i napájení.'},
  {t:'choice',q:'Co určuje patice (socket) na základní desce?',
   o:['Kolik operační paměti deska unese','Které procesory lze na desku osadit','Kolik disků lze připojit','Jakou grafickou kartu deska podporuje'],c:1,
   e:'Patice musí odpovídat procesoru. Intel a AMD používají vlastní a vzájemně nezaměnitelné patice.'},
  {t:'text',q:'Kolik jader má procesor označovaný jako hexa-core?',a:['6','šest'],
   e:'Šest. Dual-core dvě, quad-core čtyři, octa-core osm.'}
 ],
 recap:[
  '<b>Základní deska</b> propojuje všechny součástky a určuje, co do sestavy půjde zapojit.',
  '<b>Patice a čipová sada</b> rozhodují o tom, jaký procesor a kolik periferií deska unese.',
  '<b>Procesor</b> počítá, <b>operační paměť</b> mu drží rozpracovaná data po ruce.',
  '<b>SSD</b> nemá pohyblivé části, a proto startuje systém řádově rychleji než pevný disk.',
  '<b>Grafická karta</b> má vlastní čip i paměť; k desce se připojuje přes PCIe.',
  '<b>Zdroj</b> musí pokrýt součet spotřeby s rezervou asi 40 %, jinak se počítač pod zátěží restartuje.'
 ]
},

{
 id:4, mins:15, title:'Sběrnice a rozhraní', sub:'USB, SATA, PCIe a jejich rychlosti',
 blurb:'Čím se k počítači připojují disky, karty a periferie.',
 sections:[
  {t:'Sériově, nebo paralelně', html:`
   <p>Starší rozhraní posílala více bitů najednou po mnoha vodičích — <strong>paralelně</strong>. Znělo to rychleji, jenže vodiče se navzájem ruší a signály dorazí každý o kousek jinak.</p>
   <p>Proto dnes vítězí <strong>sériový</strong> přenos: jeden pár vodičů, zato mnohonásobně vyšší frekvence. Tak fungují USB, SATA i PCIe.</p>
   <p>Sběrnice se dělí i podle umístění. <strong>Vnitřní</strong> propojují součástky uvnitř skříně (PCIe, SATA), <strong>vnější</strong> vedou k periferiím (USB, HDMI).</p>`,
   key:'Sériová linka se dá zrychlit skoro libovolně, paralelní naráží na rušení mezi vodiči.'},

  {t:'Univerzální sběrnice USB', html:`
   <p><strong>USB</strong> vzniklo v roce 1996 s cílem nahradit tehdejší změť konektorů jediným univerzálním. Kromě dat vede i <strong>napájení</strong>, takže spousta zařízení nepotřebuje vlastní adaptér.</p>
   <p>Na jeden řadič lze přes rozbočovače připojit až <strong>127 zařízení</strong>. Podporuje <strong>plug and play</strong> — systém zařízení rozpozná sám — i <strong>hot plug</strong>, tedy připojení za chodu bez restartu.</p>
   <p>Generace jsou zpětně kompatibilní: novější zařízení funguje ve starším portu, jen pomaleji. Rychlost vždy určuje ten pomalejší z obou konců.</p>
   <p>Konektor <strong>USB-C</strong> je oboustranný, takže ho nelze zastrčit obráceně. Zvládne přenést data, napájení až 240 W i obraz, a proto se přes něj dnes připojují i monitory a nabíjí notebooky.</p>`,
   facts:{title:'Generace a konektory USB', rows:[
     ['USB 1.1 (1998)','12 Mb/s — klávesnice, myši'],
     ['USB 2.0 (2000)','480 Mb/s hrubě, reálně kolem 40 MB/s — flash disky, tiskárny'],
     ['USB 3.0 (2008)','5 Gb/s hrubě, po režii kolem 500 MB/s — modré porty'],
     ['USB 3.2 Gen 2','10 Gb/s, tedy 1 250 MB/s'],
     ['USB4','až 40 Gb/s, sdílí základ s Thunderboltem'],
     ['Konektory','USB-A klasický · USB-B k tiskárnám · micro-USB starší telefony · USB-C oboustranný'],
     ['Power Delivery','napájení až 240 W jedním kabelem přes USB-C'],
     ['Vlastnosti','plug and play · hot plug · až 127 zařízení na řadič · zpětná kompatibilita']]},
   key:'Barva portu napovídá rychlost: černý bývá USB 2.0, modrý USB 3.0, červený nebo žlutý znamená napájení i při vypnutém počítači.'},

  {t:'Přehled rozhraní', html:`
   <p>Jednotlivá rozhraní se liší hlavně propustností. Vyzkoušejte si, jak dlouho po nich potrvá přenést konkrétní soubor.</p>`,
   lab:'iface', labTitle:'Za jak dlouho se soubor přenese', labHint:'Vyberte rozhraní a velikost souboru.',
   key:'Uváděné hodnoty jsou teoretická maxima. Skutečná rychlost bývá o desítky procent nižší.', keyWarn:true},

  {t:'Disková rozhraní', html:`
   <p>Cesta k dnešním rychlostem vedla přes <strong>ATA</strong> (paralelní, široký plochý kabel), <strong>SATA</strong> (sériové, tenký kabel, tři generace) až po <strong>NVMe</strong>, které disk připojí přímo na linky PCIe a obchází tak omezení SATA.</p>
   <p>Rozdíl mezi SATA SSD a NVMe SSD není v samotné paměti, ale v šířce cesty, kterou k ní data tečou.</p>`,
   facts:{title:'Vývoj diskových rozhraní', rows:[
     ['ATA / PATA','paralelní, plochý kabel, do 133 MB/s — dnes se už nepoužívá'],
     ['SATA I','150 MB/s'],
     ['SATA II','300 MB/s'],
     ['SATA III','600 MB/s — strop pro klasické SSD'],
     ['NVMe přes PCIe','až tisíce MB/s, disk sedí přímo na linkách PCIe'],
     ['Konektor M.2','dnešní formát pro SSD, může být zapojen buď přes SATA, nebo přes NVMe']]},
   key:'Konektor M.2 sám o sobě nic o rychlosti neříká — záleží, jestli je disk v něm zapojený přes SATA, nebo přes NVMe.', keyWarn:true}
 ],
 tasks:[
  {q:"Student připojí nový externí SSD s rozhraním <b>USB 3.2 Gen 2</b> (10 Gb/s) do notebooku a naměří rychlost jen 40 MB/s. Vyjmenujte aspoň tři možné příčiny a popište, jak byste je postupně vyloučili.",
   s:"<p><b>Příčina 1 — port je pomalejší než disk.</b> Zapojil do černého portu USB 2.0, který zvládne kolem 40 MB/s. Rychlost vždy určuje pomalejší konec. <i>Ověření:</i> zkusit modrý nebo USB-C port.</p><p><b>Příčina 2 — kabel.</b> Kabel z nabíječky často vede jen napájení a dva datové vodiče, tedy USB 2.0. <i>Ověření:</i> vyzkoušet kabel dodaný s diskem.</p><p><b>Příčina 3 — souborový systém a typ souborů.</b> Kopírování tisíců drobných souborů je vždy mnohem pomalejší než jeden velký. <i>Ověření:</i> změřit na jednom velkém souboru.</p><p><b>Postup:</b> od nejlevnějšího a nejrychlejšího testu — nejdřív jiný port, pak jiný kabel, pak jiný typ dat. Naměřených 40 MB/s ovšem hodně nápadně odpovídá stropu USB 2.0, takže bych začal portem.</p>"},
  {q:"Dva disky mají oba konektor <b>M.2</b> a stejnou kapacitu, ale jeden stojí dvakrát tolik. Čím to může být a jak zjistíte, který je který?",
   s:"<p><b>Konektor M.2 sám o sobě nic o rychlosti neříká.</b> Existují dvě zcela odlišné varianty:</p><p><b>M.2 SATA</b> — disk je vnitřně připojený přes SATA, takže naráží na strop 600 MB/s. Levnější.</p><p><b>M.2 NVMe</b> — disk sedí přímo na linkách PCIe a dosahuje tisíců MB/s. Dražší.</p><p><b>Jak poznat:</b> podle zářezů na konektoru (klíčů). Varianta SATA má dva zářezy (B+M), NVMe zpravidla jeden (M). Spolehlivější je ale podívat se do specifikace na rozhraní a uváděnou rychlost čtení — u SATA nikdy nepřekročí 560 MB/s.</p><p><b>Pozor i na desku:</b> některé sloty M.2 podporují jen jednu z variant. To je nutné ověřit v návodu k desce.</p>"}
 ],
 questions:[
  {t:'choice',q:'Proč sériový přenos vytlačil paralelní?',
   o:['Potřebuje méně vodičů, a proto je levnější','Dá se provozovat na mnohem vyšší frekvenci bez rušení mezi vodiči','Přenáší více bitů najednou','Nepotřebuje kontrolu chyb'],c:1,
   e:'U paralelního přenosu se signály na sousedních vodičích ovlivňují a nedorazí zároveň. Sériová linka tenhle problém nemá.'},
  {t:'choice',q:'Jakou propustnost má rozhraní SATA III?',
   o:['150 MB/s','300 MB/s','600 MB/s','1200 MB/s'],c:2,
   e:'Každá generace SATA propustnost zdvojnásobila: 150, 300 a 600 MB/s.'},
  {t:'choice',q:'Co umí konektor USB-C navíc oproti staršímu USB-A?',
   o:['Nic, liší se jen tvarem','Je oboustranný a zvládne data, napájení i obraz','Funguje bez ovladačů','Přenáší pouze zvuk'],c:1,
   e:'USB-C nelze zastrčit obráceně a jedním kabelem přenese data, obraz i napájení až 240 W.'}
 ],
 recap:[
  '<b>Sériový přenos</b> vytlačil paralelní, protože snese mnohem vyšší frekvence.',
  '<b>USB</b> vede data i napájení, zvládá plug and play a připojení za chodu.',
  '<b>Generace USB</b> jsou zpětně kompatibilní — rychlost určuje pomalejší konec.',
  '<b>USB-C</b> je oboustranný a jedním kabelem přenese data, obraz i napájení až 240 W.',
  '<b>SATA</b> má tři generace: 150, 300 a 600 MB/s.',
  '<b>NVMe</b> připojuje disk přímo na PCIe a obchází tím strop SATA.'
 ]
},

{
 id:5, mins:12, title:'Paměti v počítači', sub:'ROM, RAM a hierarchie pamětí',
 blurb:'Proč počítač potřebuje pět druhů paměti místo jedné.',
 sections:[
  {t:'ROM a RAM', html:`
   <p><strong>ROM</strong> si obsah pamatuje i bez napájení a běžně se nepřepisuje — drží například firmware desky. <strong>RAM</strong> je rychlá a přepisovatelná, ale po vypnutí je prázdná.</p>
   <p>Té vlastnosti se říká <strong>energetická závislost</strong>. Právě proto se rozpracovaná práce musí uložit na disk, než počítač vypnete.</p>
   <p>Hranice mezi oběma světy se ale stírá. Dnešní <strong>flash paměť</strong> si pamatuje bez napájení jako ROM, přesto ji lze přepisovat — funguje na ní BIOS, flash disky i SSD.</p>`,
   facts:{title:'Druhy pamětí', rows:[
     ['ROM','jen pro čtení, obsah zapsán při výrobě'],
     ['EEPROM a Flash','uchová obsah bez napájení, ale lze ji přepsat — BIOS, SSD, flash disky'],
     ['SRAM','velmi rychlá, drahá, nepotřebuje obnovování — používá se na cache'],
     ['DRAM','levnější a pomalejší, obsah je nutné neustále obnovovat — operační paměť'],
     ['DDR1 až DDR5','generace DRAM, každá zhruba zdvojnásobila propustnost'],
     ['SO-DIMM','zkrácený modul paměti pro notebooky']]},
   key:'RAM je pracovní stůl, disk je skříň. Na stůl se vejde míň, zato je všechno hned po ruce.'},

  {t:'Hierarchie pamětí', html:`
   <p>Rychlá paměť je drahá, levná paměť je pomalá. Počítač proto staví paměti do pyramidy — nahoře maličké a bleskové, dole obrovské a pomalé.</p>
   <p>Uprostřed pyramidy stojí <strong>cache</strong>, malá rychlá paměť mezi procesorem a operační pamětí. Drží kopie dat, se kterými se právě pracuje, aby procesor nemusel čekat na pomalou RAM. Běžné procesory mají tři úrovně: L1 je nejmenší a nejrychlejší, L3 největší a sdílená mezi jádry.</p>`,
   lab:'pyramid', labTitle:'Pyramida pamětí', labHint:'Klikněte na úroveň a porovnejte kapacitu s rychlostí.',
   key:'Mezi registrem a pevným diskem je rozdíl v době přístupu zhruba milionkrát.'},

  {t:'Operační paměť v praxi', html:`
   <p>Kapacita rozhoduje o tom, kolik programů poběží pohodlně vedle sebe. Když paměť dojde, systém začne odkládat data na disk — a počítač se rázem zpomalí na zlomek.</p>
   <p>Moduly se osazují po dvojicích, aby se využil <strong>dvoukanálový režim</strong>, který propustnost paměti zhruba zdvojnásobí. Dva moduly po 8 GB jsou proto lepší volba než jeden šestnáctigigabajtový.</p>
   <p>Generace se nedají míchat: DDR4 do slotu pro DDR5 mechanicky nepasuje, protože má zářez na jiném místě.</p>`,
   facts:{title:'Kolik paměti na co stačí', rows:[
     ['8 GB','kancelář, výuka, prohlížeč — dnes minimum'],
     ['16 GB','běžný standard pro práci i hry'],
     ['32 GB a víc','střih videa, virtuální stroje, náročná grafika'],
     ['Dvoukanálový režim','dva stejné moduly místo jednoho — výrazně vyšší propustnost'],
     ['Frekvence','udává se v MHz, vyšší znamená rychlejší přenos'],
     ['Odkládací soubor','když RAM dojde, systém odkládá na disk a znatelně zpomalí']]},
   key:'Nedostatek paměti se pozná okamžitě — počítač začne „šrotovat" diskem a přepínání mezi okny se zadrhává.'}
 ],
 tasks:[
  {q:"Student má notebook s 8 GB paměti a stěžuje si, že při práci s dvaceti panely v prohlížeči a otevřeným editorem se všechno zadrhává. Disk přitom svítí skoro pořád. Co se děje a jaká jsou řešení?",
   s:"<p><b>Došla operační paměť a systém odkládá na disk.</b> Když se data nevejdou do RAM, přesouvá je systém do odkládacího souboru. Disk je ovšem řádově pomalejší, takže každé přepnutí okna znamená čekání — odtud to trvalé svícení diskové kontrolky.</p><p><b>Řešení 1 — přidat paměť.</b> Nejúčinnější. Ideálně na 16 GB a ve dvou modulech, aby fungoval dvoukanálový režim.</p><p><b>Řešení 2 — omezit spotřebu paměti.</b> Zavřít nepoužívané panely, vypnout rozšíření prohlížeče. Zdarma, ale řeší jen následek.</p><p><b>Řešení 3 — SSD, pokud tam ještě je pevný disk.</b> Odkládání nezmizí, ale bude řádově rychlejší, takže zadrhávání výrazně poleví.</p><p><b>Co nepomůže:</b> rychlejší procesor. Ten není úzkým hrdlem, jen čeká.</p>"},
  {q:"Proč se nevyrábí počítač, který by měl místo celé hierarchie pamětí jen jednu velkou a hodně rychlou paměť? Co by tomu bránilo?",
   s:"<p><b>Bránila by cena a fyzika, ne technická neschopnost.</b></p><p><b>Cena.</b> Rychlá paměť typu SRAM, ze které se dělá cache, potřebuje na jeden bit šest tranzistorů. DRAM v operační paměti si vystačí s jedním tranzistorem a kondenzátorem. Šestnáct gigabajtů SRAM by stálo víc než celý počítač a zabralo by mnohonásobně víc místa na čipu.</p><p><b>Fyzika.</b> Signál se šíří konečnou rychlostí. Čím větší paměť, tím delší vodiče a tím déle trvá, než se k danému místu dostane. Velká paměť je proto <i>nutně</i> pomalejší než malá, i kdyby byla ze stejné technologie.</p><p><b>Hierarchie je chytrý kompromis.</b> Využívá toho, že programy sahají opakovaně na stejná místa — takzvané lokality. Malá rychlá cache proto v praxi zachytí většinu přístupů a navenek se celek chová skoro jako by celá paměť byla rychlá.</p>"}
 ],
 questions:[
  {t:'choice',q:'Co se stane s obsahem operační paměti po vypnutí počítače?',
   o:['Uloží se automaticky na disk','Smaže se, protože RAM je energeticky závislá','Zůstane zachován až týden','Přesune se do cache'],c:1,
   e:'RAM potřebuje k udržení obsahu napájení. Proto se rozpracovaná práce musí uložit na disk.'},
  {t:'choice',q:'Která paměť je v počítači nejrychlejší?',
   o:['Operační paměť RAM','Registry procesoru','Cache L3','Disk SSD'],c:1,
   e:'Registry jsou přímo v jádře procesoru. Jsou nejmenší, ale přístup k nim trvá jediný takt.'},
  {t:'text',q:'Kolik úrovní cache mají běžné dnešní procesory?',a:['3','tři'],
   e:'Tři: L1, L2 a L3. Směrem dolů kapacita roste a rychlost klesá.'}
 ],
 recap:[
  '<b>ROM</b> si pamatuje bez napájení, <b>RAM</b> je po vypnutí prázdná.',
  '<b>Flash paměť</b> spojuje obojí — uchová obsah bez napájení a přitom se dá přepsat.',
  '<b>Hierarchie pamětí:</b> registry → cache L1/L2/L3 → RAM → SSD → pevný disk.',
  '<b>Cache</b> drží kopie dat z RAM, aby na ni procesor nemusel čekat. L1 je nejmenší a nejrychlejší, L3 sdílená mezi jádry.',
  '<b>Čím rychlejší paměť, tím dražší</b> — proto jí je nahoře pyramidy tak málo.',
  '<b>Dvoukanálový režim</b> se dvěma moduly výrazně zvýší propustnost paměti.'
 ]
},

{
 id:6, mins:12, title:'Periferie počítače', sub:'Vstupní, výstupní a vstupně-výstupní zařízení',
 blurb:'Čím do počítače data dostáváme a jak se dostávají zpátky ven.',
 sections:[
  {t:'Tři skupiny periferií', html:`
   <p><strong>Vstupní</strong> zařízení přinášejí data do počítače — klávesnice, myš, skener, mikrofon. <strong>Výstupní</strong> je předávají člověku — monitor, tiskárna, reproduktory.</p>
   <p>Některá zvládají obojí. Dotykový displej ukazuje obraz i přijímá dotyk, flash disk data načítá i ukládá. Těm říkáme <strong>vstupně-výstupní</strong>.</p>`,
   facts:{title:'Kam co patří', rows:[
     ['Vstupní','klávesnice, myš, touchpad, skener, mikrofon, webkamera, čtečka kódů'],
     ['Výstupní','monitor, projektor, tiskárna, reproduktory, sluchátka'],
     ['Vstupně-výstupní','dotykový displej, flash disk, multifunkční tiskárna, síťová karta'],
     ['Rozhodující kritérium','směr toku dat, ne vzhled zařízení ani způsob připojení']]},
   key:'U vstupně-výstupních zařízení hledejte obě cesty najednou — musí data přijímat i vydávat.'},

  {t:'Rozřaďte periferie', html:`
   <p>Vyzkoušejte si to na konkrétních zařízeních.</p>`,
   lab:'sortgame', labTitle:'Kam které zařízení patří', labHint:'Vyberte zařízení a přiřaďte mu skupinu.',
   key:'Zákeřné bývají zařízení s doplňkovou funkcí — ovladač s vibracemi přijímá stisky a zároveň dostává povel k rozvibrování.'},

  {t:'Monitory a tiskárny', html:`
   <p>U monitoru rozhoduje <strong>rozlišení</strong> (počet bodů), <strong>úhlopříčka</strong> a <strong>obnovovací frekvence</strong> v hertzích. Čím vyšší rozlišení na stejné úhlopříčce, tím jemnější obraz.</p>
   <p>Tiskárny se liší technologií. <strong>Inkoustová</strong> je levná na pořízení a dobrá na fotografie, <strong>laserová</strong> vychází levněji na stránku a hodí se na velké objemy textu.</p>
   <p>Obrazovky míchají barvy z červené, zelené a modré — model <strong>RGB</strong>. Tiskárny naopak z azurové, purpurové, žluté a černé — model <strong>CMYK</strong>. Proto výtisk nikdy nevypadá úplně stejně jako obraz na monitoru.</p>`,
   lab:'dpi', labTitle:'Jak velký výtisk fotografie snese', labHint:'Zadejte rozlišení fotografie a požadovanou kvalitu tisku.',
   facts:{title:'Parametry, které se hodí znát', rows:[
     ['Rozlišení monitoru','Full HD 1920×1080 · QHD 2560×1440 · 4K 3840×2160'],
     ['Obnovovací frekvence','60 Hz běžně, 120 a více Hz pro plynulý pohyb'],
     ['DPI','počet tiskových bodů na palec — 300 pro fotografie, 150 pro plakáty'],
     ['RGB','červená, zelená, modrá — pro obrazovky'],
     ['CMYK','azurová, purpurová, žlutá, černá — pro tisk'],
     ['Inkoustová tiskárna','levnější pořízení, lepší fotografie, dražší provoz'],
     ['Laserová tiskárna','dražší pořízení, rychlejší a levnější tisk textu']]},
   key:'Pro běžný fotografický tisk se počítá s 300 DPI, pro plakát prohlížený z dálky stačí i 150 DPI.'}
 ],
 tasks:[
  {q:"Rodič chce koupit tiskárnu pro rodinu se dvěma školáky. Tisknou hlavně referáty a občas fotky, dohromady asi 40 stran měsíčně. Prodavač doporučuje inkoustovou za 1 500 Kč. Co byste poradili a proč?",
   s:"<p><b>U tohohle profilu bych doporučil černobílou laserovou</b>, přestože stojí na pořízení víc.</p><p><b>Rozhodující je způsob používání, ne objem.</b> Čtyřicet stran měsíčně je málo — a právě to je pro inkoustovou tiskárnu nejhorší scénář. Inkoust v tryskách zasychá, tiskárna při každém zapnutí čistí hlavu a spotřebuje přitom víc inkoustu než na samotný tisk. Po pár měsících nepoužívání bývá potřeba nová kazeta, i když se skoro netisklo.</p><p><b>Laserový toner nezasychá.</b> Vydrží roky a jedna náplň zvládne tisíce stran. Na referáty je navíc text ostřejší a odolný proti rozmazání.</p><p><b>Kompromis pro fotky:</b> pár fotek ročně vyjde levněji nechat vyvolat ve fotolabu — kvalita bude lepší než z domácí tiskárny za 1 500 Kč.</p><p><b>Kdy naopak inkoustovou:</b> pokud by se tisklo hodně barevně a pravidelně, nebo u modelů s doplňovacími nádržkami.</p>"},
  {q:"Fotografie má rozlišení <b>2048 × 1536</b> bodů. Vejde se v kvalitě 300 DPI na formát A4 (21 × 29,7 cm)? Spočítejte a rozhodněte.",
   s:"<p><b>Výpočet:</b> jeden palec je 2,54 cm.</p><p>Šířka: 2048 ÷ 300 = 6,83 palce → 6,83 × 2,54 = <b>17,3 cm</b><br>Výška: 1536 ÷ 300 = 5,12 palce → 5,12 × 2,54 = <b>13,0 cm</b></p><p><b>Nevejde se.</b> Při 300 DPI vyjde výtisk 17,3 × 13,0 cm, což je zhruba formát pohlednice. Na A4 by se musel zvětšit skoro dvojnásobně a hustota by klesla na asi 175 DPI.</p><p><b>Jenže to nemusí vadit.</b> Na plakát prohlížený z metru je 175 DPI dostačujících. Pravidlo „300 DPI“ platí pro fotografie prohlížené z blízka — u větších formátů se s rostoucí vzdáleností pozorovatele požadavek přirozeně snižuje.</p>"}
 ],
 questions:[
  {t:'choice',q:'Do které skupiny patří dotykový displej?',
   o:['Vstupní','Výstupní','Vstupně-výstupní','Nepatří mezi periferie'],c:2,
   e:'Zobrazuje obraz (výstup) a zároveň přijímá dotyk (vstup), takže data tečou oběma směry.'},
  {t:'choice',q:'Co udává hodnota DPI u tiskárny?',
   o:['Počet stránek za minutu','Počet tiskových bodů na palec','Počet barev tonerů','Hmotnost papíru'],c:1,
   e:'Dots per inch. Čím vyšší hodnota, tím jemnější detaily tiskárna zvládne.'},
  {t:'text',q:'Kolik barev používá tiskový model CMYK?',a:['4','čtyři'],
   e:'Čtyři: azurová, purpurová, žlutá a černá.'}
 ],
 recap:[
  '<b>Vstupní</b> zařízení data přinášejí, <b>výstupní</b> je předávají ven, <b>vstupně-výstupní</b> zvládají obojí.',
  '<b>Rozhoduje směr toku dat</b>, ne vzhled zařízení ani způsob připojení.',
  '<b>Rozlišení a úhlopříčka</b> spolu určují jemnost obrazu na monitoru.',
  '<b>DPI</b> je počet tiskových bodů na palec; pro fotografie se počítá s 300 DPI.',
  '<b>RGB</b> je model pro obrazovky, <b>CMYK</b> čtyřbarevný pro tisk.',
  '<b>Inkoustová tiskárna</b> je levnější na pořízení, <b>laserová</b> na provoz.'
 ]
},

{
 id:7, mins:12, title:'Mobilní a dotyková zařízení', sub:'Notebooky, tablety, telefony a architektura ARM',
 blurb:'Proč telefon vydrží celý den, a notebook ne.',
 sections:[
  {t:'Kategorie zařízení', html:`
   <p><strong>Notebook</strong> je přenosný počítač s plnou výbavou, <strong>ultrabook</strong> jeho tenká a lehká varianta podle specifikací Intelu. <strong>Chromebook</strong> staví na cloudu a systému ChromeOS.</p>
   <p>Bez klávesnice pokračují <strong>tablety</strong> a <strong>chytré telefony</strong>, samostatnou skupinou jsou <strong>čtečky knih</strong> s displejem z elektronického inkoustu a <strong>nositelná elektronika</strong> — hodinky a náramky.</p>`,
   facts:{title:'Přehled kategorií', rows:[
     ['Notebook','plnohodnotný počítač s klávesnicí, výdrž hodiny až den'],
     ['Ultrabook','tenký a lehký notebook splňující specifikace Intelu'],
     ['Chromebook','systém ChromeOS, práce převážně v cloudu, nízká cena'],
     ['Tablet','dotykové ovládání, mobilní systém, bez klávesnice'],
     ['Chytrý telefon','tablet velikosti dlaně s mobilní sítí'],
     ['Čtečka knih','elektronický inkoust, výdrž týdny, čitelná na slunci'],
     ['Nositelná elektronika','hodinky a náramky, snímače tepu a pohybu']]},
   key:'Čtečka vydrží týdny proto, že elektronický inkoust spotřebuje energii jen při změně stránky, ne při jejím zobrazování.'},

  {t:'x86 versus ARM', html:`
   <p>Klasické počítače stojí na architektuře <strong>x86</strong> s rozsáhlou instrukční sadou — přístup zvaný CISC. Mobilní zařízení používají <strong>ARM</strong>, tedy <strong>RISC</strong> s malým počtem jednoduchých instrukcí.</p>
   <p>Méně instrukcí znamená menší a jednodušší čip, a ten spotřebuje méně energie. Právě proto telefon vydrží celý den a nemá ventilátor.</p>`,
   lab:'arm', labTitle:'Dvě filozofie procesorů', labHint:'Přepněte architekturu a porovnejte vlastnosti.',
   key:'Hranice se stírá. Procesory ARM se dnes dostávají i do notebooků a serverů, kde vyhrávají poměrem výkonu ke spotřebě.'},

  {t:'Displeje a výdrž', html:`
   <p>Displej bývá největším žroutem energie. <strong>LCD</strong> potřebuje podsvícení celé plochy, <strong>OLED</strong> svítí každým bodem zvlášť — a černá barva tak nespotřebuje nic. <strong>Elektronický inkoust</strong> odebírá energii jen při překreslení stránky.</p>
   <p>Kapacita baterie se udává v <strong>mAh</strong> nebo <strong>Wh</strong>. Výdrž z ní ale sama o sobě nevyplývá — záleží na displeji, procesoru a tom, co zařízení dělá.</p>`,
   facts:{title:'Technologie displejů', rows:[
     ['LCD','podsvícení celé plochy, levné, černá není úplně černá'],
     ['OLED','každý bod svítí sám, dokonalá černá, vyšší kontrast'],
     ['Elektronický inkoust','energii bere jen při změně stránky, čitelný na slunci, pomalé překreslení'],
     ['Kapacitní dotyk','reaguje na vodivost prstu, zvládá více dotyků najednou'],
     ['Kapacita baterie','mAh u telefonů, Wh u notebooků']]},
   key:'Tmavý režim šetří baterii jen u displejů OLED. U LCD podsvícení svítí pořád stejně.'}
 ],
 tasks:[
  {q:"Apple v roce 2020 přešel u počítačů Mac z procesorů Intel (x86) na vlastní čipy ARM. Jaké výhody tím získal a co ho to stálo?",
   s:"<p><b>Co získal:</b></p><p><b>Poměr výkonu ke spotřebě.</b> Notebooky s ARM vydrží na baterii výrazně déle a v mnoha případech nepotřebují ventilátor.</p><p><b>Kontrolu nad vývojem.</b> Apple už nečeká, až Intel vydá nový procesor, a může čip navrhnout přesně na míru svým systémům.</p><p><b>Sjednocení s iPhonem a iPadem.</b> Stejná architektura znamená, že mobilní aplikace běží i na počítači.</p><p><b>Co ho to stálo:</b></p><p><b>Nekompatibilitu.</b> Programy přeložené pro x86 na ARM přímo neběží. Apple to překlenul překladovou vrstvou Rosetta 2, která je ovšem dočasná a stojí výkon.</p><p><b>Ztrátu možnosti spustit Windows</b> tak, jak to šlo dřív, a komplikace pro virtualizaci.</p><p><b>Nutnost přesvědčit vývojáře</b>, aby své programy přeložili znovu. To u menších nástrojů trvalo roky a část jich zanikla.</p>"},
  {q:"Kolegyně tvrdí, že tmavý režim v telefonu šetří baterii, a proto ho zapíná i na starším tabletu. Má pravdu?",
   s:"<p><b>U telefonu nejspíš ano, u tabletu podle typu displeje pravděpodobně ne.</b></p><p><b>OLED</b> — každý bod svítí sám a černá znamená, že bod nesvítí vůbec. Tmavý režim tedy skutečně sníží spotřebu, a to znatelně, zvlášť u převážně černého obsahu.</p><p><b>LCD</b> — podsvícení svítí přes celou plochu nepřetržitě, ať je na displeji cokoli. Tekuté krystaly světlo jen propouštějí nebo blokují. Tmavý režim proto <b>spotřebu prakticky nezmění</b>.</p><p><b>Jak to ověřit:</b> na OLED displeji je černá skutečně černá a v temné místnosti nejde poznat, kde obrazovka končí. Na LCD je „černá“ mírně šedá a při pohledu z boku prosvítá.</p><p><b>Tmavý režim má i tak smysl</b> — kvůli menší únavě očí ve tmě. Jen ho neprodávejme jako úsporu tam, kde žádná není.</p>"}
 ],
 questions:[
  {t:'choice',q:'Čím se architektura ARM liší od x86?',
   o:['Má vyšší taktovací frekvenci','Má malý počet jednoduchých instrukcí a nižší spotřebu','Nepotřebuje operační paměť','Zvládá pouze celočíselné výpočty'],c:1,
   e:'ARM staví na přístupu RISC. Jednodušší instrukce znamenají menší a úspornější čip.'},
  {t:'choice',q:'Jaký displej používají čtečky elektronických knih?',
   o:['OLED','Elektronický inkoust','Plazmový','CRT'],c:1,
   e:'Elektronický inkoust odebírá energii jen při překreslení stránky a čte se z něj i na přímém slunci.'},
  {t:'choice',q:'Co je charakteristické pro ultrabook?',
   o:['Nemá vlastní baterii','Tenké tělo a parametry stanovené Intelem','Používá výhradně systém Linux','Nelze k němu připojit monitor'],c:1,
   e:'Označení ultrabook si Intel podmínil konkrétními požadavky na tloušťku, výdrž a rychlost startu.'}
 ],

{
 id:8, mins:18, title:'Operační systémy', sub:'Správce prostředků, vrstvy a plánovač procesů',
 blurb:'Kdo v počítači rozděluje práci mezi programy.',
 sections:[
  {t:'K čemu je operační systém', html:`
   <p>Operační systém je <strong>správce prostředků</strong>. Rozhoduje, který program dostane procesor, kolik paměti a kdy smí zapisovat na disk.</p>
   <p>Zároveň vytváří <strong>virtuální počítač</strong> — skrývá před programy hardwarové detaily a nabízí jim jednotné rozhraní. Díky tomu jedna aplikace běží na tisících různých sestav, aniž by o nich cokoli věděla.</p>`,
   facts:{title:'Co všechno operační systém řeší', rows:[
     ['Správa procesoru','přiděluje čas jednotlivým procesům a přepíná mezi nimi'],
     ['Správa paměti','rozděluje operační paměť, hlídá hranice mezi procesy'],
     ['Správa souborů','vede evidenci, kde co leží, a hlídá přístupová práva'],
     ['Správa vstupů a výstupů','obsluhuje disky, tiskárny a další periferie'],
     ['Uživatelské rozhraní','zprostředkuje ovládání — graficky nebo příkazovým řádkem'],
     ['Ochrana','odděluje uživatele a brání neoprávněnému přístupu']]},
   key:'Bez operačního systému by každý program musel sám obsluhovat konkrétní model disku, klávesnice i grafické karty.'},

  {t:'Vrstvy systému', html:`
   <p>Systém je poskládaný z vrstev. Každá využívá služby té pod sebou a nabízí je té nad sebou. Nejnižší je hardware, nejvyšší aplikace, se kterými pracuje uživatel.</p>
   <p>Po zapnutí se vrstvy oživují odspodu — a přesně v tomhle pořadí probíhá start počítače.</p>`,
   lab:'layers', labTitle:'Od hardwaru k aplikacím', labHint:'Klikněte na vrstvu.',
   facts:{title:'Co se děje po stisku tlačítka', rows:[
     ['1. Zapnutí napájení','zdroj rozvede napětí, procesor začne číst firmware'],
     ['2. POST','firmware BIOS nebo UEFI otestuje paměť, procesor a disky'],
     ['3. Hledání zavaděče','firmware najde na disku zaváděcí záznam'],
     ['4. Načtení jádra','zavaděč spustí jádro operačního systému'],
     ['5. Systémové služby','naběhnou ovladače, správci paměti a souborů'],
     ['6. Přihlášení a GUI','objeví se grafické rozhraní a lze spouštět aplikace']]},
   key:'Jádro (kernel) je jediná část, která má plný přístup k hardwaru. Všechno ostatní o něj musí požádat.'},

  {t:'BIOS a jeho nástupce UEFI', html:`
   <p><strong>BIOS</strong> je původní firmware z osmdesátých let. Pracuje v šestnáctibitovém režimu, umí nastartovat jen z disků do 2 TB a nabízí strohé textové menu ovládané klávesnicí.</p>
   <p><strong>UEFI</strong> ho od roku 2010 nahrazuje. Startuje rychleji, zvládá disky prakticky libovolné velikosti, má grafické rozhraní ovladatelné myší a umí <strong>Secure Boot</strong> — kontrolu, že se zavádí jen podepsaný a nepozměněný systém.</p>
   <p>V běžné mluvě se pořád říká „BIOS\u201c i tam, kde jde ve skutečnosti o UEFI. Nastavení se do něj vstupuje stejně: klávesou při startu, nejčastěji Del nebo F2.</p>`,
   facts:{title:'BIOS versus UEFI', rows:[
     ['Vznik','BIOS 1981 · UEFI se prosazuje od roku 2010'],
     ['Rozhraní','BIOS textové, jen klávesnice · UEFI grafické, i myš'],
     ['Rozdělení disku','BIOS pracuje s MBR · UEFI s modernějším GPT'],
     ['Velikost disku','BIOS nastartuje z disku do 2 TB · UEFI prakticky bez omezení'],
     ['Rychlost startu','UEFI je znatelně rychlejší, umí přeskočit část testů'],
     ['Secure Boot','jen UEFI — ověří podpis systému a zabrání zavedení podvrženého'],
     ['Vstup do nastavení','u obou klávesou při startu, nejčastěji Del nebo F2']]},
   key:'Secure Boot je dvojsečný: chrání před podvrženým systémem, ale může komplikovat instalaci Linuxu. Vypíná se v nastavení UEFI.', keyWarn:true},

  {t:'Plánovač procesů', html:`
   <p>Jádro procesoru zvládne v jednu chvíli jediné vlákno. Dojem, že běží deset programů najednou, dělá <strong>plánovač</strong>: rozdělí čas na krátké úseky a rychle mezi procesy přepíná.</p>
   <p>Tomu se říká <strong>multitasking</strong>. Přepnutí ovšem něco stojí — procesor musí odložit stav jednoho procesu a načíst stav druhého.</p>`,
   lab:'scheduler', labTitle:'Jak se střídají procesy', labHint:'Změňte délku časového kvanta a spusťte plánování.',
   key:'Krátké kvantum působí plynuleji, ale přepínání samo o sobě stojí čas. Příliš dlouhé zase způsobí, že systém přestane reagovat.'},

  {t:'Nejrozšířenější systémy', html:`
   <p>Na počítačích vládne <strong>Windows</strong>, mezi servery a vývojáři <strong>Linux</strong>, na zařízeních Apple <strong>macOS</strong>. V mobilním světě si trh dělí <strong>Android</strong> a <strong>iOS</strong>.</p>
   <p>Linux se šíří v podobě <strong>distribucí</strong> — ty se liší grafickým prostředím, přednastavenými programy a mírou náročnosti na uživatele.</p>`,
   facts:{title:'Přehled systémů', rows:[
     ['Windows','nejrozšířenější na počítačích, placený, široká podpora programů'],
     ['Linux','otevřený a zdarma, v distribucích (Ubuntu, Mint, Debian), vládne serverům'],
     ['macOS','jen na počítačích Apple, základ Darwin, rozhraní Aqua'],
     ['Android','nejrozšířenější mobilní systém, postavený na linuxovém jádře'],
     ['iOS','mobilní systém Apple, uzavřený ekosystém'],
     ['ChromeOS','systém chromebooků, práce převážně v prohlížeči']]},
   key:'Mobilní systémy vycházejí ze stejných principů jako ty desktopové — jen mají jinak řešené rozhraní a přísnější správu spotřeby.'}
 ],
 tasks:[
  {q:"Nastavíte plánovači časové kvantum <b>500 ms</b> místo obvyklých několika milisekund. Co se stane s chováním systému a proč?",
   s:"<p><b>Systém přestane působit plynule.</b></p><p><b>Co se zlepší:</b> ubude přepínání mezi procesy, a tím i režie s ním spojená. Celková propustnost výpočtů mírně vzroste — každý proces dostane delší souvislý úsek a lépe využije obsah cache.</p><p><b>Co se zhorší, a mnohem víc:</b> odezva. Když právě běží jiný proces, musí váš stisk klávesy čekat až půl sekundy. Při pěti běžících procesech to je v nejhorším případě přes dvě vteřiny, než se dostane na řadu ten váš. Uživatel to vnímá jako zaseknutý počítač.</p><p><b>Proto se kvantum volí krátké.</b> Ztráta na propustnosti je malá, kdežto zisk na odezvě zásadní — a u interaktivního systému je odezva to jediné, co uživatel pozná. Vyzkoušet si to jde v simulaci plánovače, kde se s délkou kvanta mění počet přepnutí.</p>"},
  {q:"Počítač se po zapnutí zastaví na černé obrazovce a nic dál se neděje. Jak byste podle znalosti startovací sekvence postupovali při hledání příčiny?",
   s:"<p><b>Postupujte po krocích startu odspodu — kde se to zastaví, tam je problém.</b></p><p><b>1. Naskočilo napájení?</b> Točí se ventilátory, svítí kontrolka? Pokud ne, problém je ve zdroji nebo napájení desky, ne v systému.</p><p><b>2. Proběhl POST?</b> Objevilo se logo výrobce nebo pípnutí? Pokud ne, selhal test hardwaru — nejčastěji špatně usazená paměť nebo grafická karta. Pípací kódy v návodu k desce řeknou co.</p><p><b>3. Našel se zavaděč?</b> Dostanete se do nastavení UEFI klávesou Del nebo F2? Pokud ano, hardware žije a chyba je dál. Zkontrolujte, jestli je disk v seznamu zaváděcích zařízení — když tam není, může být odpojený nebo mrtvý.</p><p><b>4. Naběhlo jádro?</b> Objeví se logo systému a pak se to zasekne? Pak jde o software: poškozený systémový soubor nebo vadný ovladač. Řešením bývá nouzový režim a oprava při spuštění.</p><p><b>Smysl postupu:</b> každý krok vyloučí celou vrstvu. Bez toho člověk náhodně zkouší věci, které s příčinou nesouvisejí.</p>"}
 ],
 questions:[
  {t:'choice',q:'Co je hlavní úlohou operačního systému?',
   o:['Počítat matematické operace','Spravovat prostředky počítače a rozdělovat je mezi programy','Ukládat dokumenty','Zobrazovat webové stránky'],c:1,
   e:'Operační systém přiděluje procesor, paměť a vstupně-výstupní zařízení jednotlivým procesům a řeší mezi nimi konflikty.'},
  {t:'choice',q:'Co provede firmware BIOS nebo UEFI hned po zapnutí počítače?',
   o:['Načte jádro operačního systému do paměti','Otestuje hardware (POST) a najde zavaděč systému','Spustí ovladače grafické karty','Zkontroluje aktualizace systému'],c:1,
   e:'Nejdřív proběhne test POST, pak firmware najde zaváděcí záznam a předá řízení operačnímu systému.'},
  {t:'choice',q:'Co znamená multitasking?',
   o:['Skutečně souběžný běh programů na více jádrech','Zdánlivě současný běh více procesů díky rychlému přepínání','Rozdělení jednoho programu mezi více počítačů','Práce více uživatelů na jednom souboru'],c:1,
   e:'Plánovač přiděluje každému procesu krátké časové úseky. Přepínání je tak rychlé, že uživatel vnímá souběžný běh.'}
 ],
 recap:[
  '<b>Operační systém</b> spravuje procesor, paměť, disky a periferie a rozděluje je mezi programy.',
  '<b>Virtuální počítač</b> znamená, že programy nemusí znát konkrétní hardware.',
  '<b>Vrstvy:</b> hardware → firmware → jádro → systémové služby → rozhraní → aplikace.',
  '<b>Start počítače:</b> napájení → POST → zavaděč → jádro → služby → grafické rozhraní.',
