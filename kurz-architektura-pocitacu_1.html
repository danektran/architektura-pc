  '<b>UEFI</b> nahrazuje starší BIOS — grafické rozhraní, disky nad 2 TB, Secure Boot.',
  '<b>Plánovač</b> rychle přepíná mezi procesy, čímž vzniká dojem souběžného běhu.'
 ]
},

{
 id:9, mins:10, title:'Bezdrátové prezentování', sub:'AirPlay, Miracast, Chromecast a spol.',
 blurb:'Jak dostat obraz z notebooku na projektor bez kabelu.',
 sections:[
  {t:'Proč bezdrátově', html:`
   <p>Kabel HDMI funguje spolehlivě, ale připoutá přednášejícího k jednomu místu. Bezdrátový přenos vrací volnost pohybu po učebně a zkracuje přepojování mezi zařízeními na pár vteřin.</p>
   <p>Technologie se dělí podle způsobu spojení. <strong>Přímé</strong> spojení vzniká mezi dvěma zařízeními bez sítě — funguje i tam, kde Wi-Fi není. <strong>Přes síť</strong> jde obraz společnou Wi-Fi, což vyžaduje fungující infrastrukturu, zato dovolí i streamování rovnou z internetu.</p>`,
   facts:{title:'Dva způsoby spojení', rows:[
     ['Přímé spojení','Miracast, Intel WiDi — bez potřeby sítě, jednodušší v cizím prostředí'],
     ['Přes síť Wi-Fi','AirPlay, Chromecast — vyžaduje síť, umí i obsah z internetu'],
     ['Zrcadlení','na projektoru se objeví totéž co na displeji zařízení'],
     ['Rozšíření plochy','projektor slouží jako druhý monitor s vlastním obsahem'],
     ['Typický problém','v učebnách s množstvím Wi-Fi sítí dochází k rušení a výpadkům']]},
   key:'Ve školní budově plné Wi-Fi sítí bývá spolehlivější přímé spojení než přenos přes síť.'},

  {t:'Přehled technologií', html:`
   <p>Každé řešení má svůj ekosystém a své podmínky. Vyberte technologii a podívejte se, co potřebuje a co umí.</p>`,
   lab:'wireless', labTitle:'Čím se technologie liší', labHint:'Klikněte na technologii.',
   key:'Miracast a Intel WiDi se spojují napřímo, takže fungují i bez sítě. Apple TV a Chromecast potřebují společnou Wi-Fi.'},

  {t:'Co si pořídit', html:`
   <p>Volba závisí na tom, jaká zařízení do učebny chodí a co už máte za zobrazovač. Starší projektor bez bezdrátové podpory přitom nemusíte vyměňovat — stačí do něj zapojit adaptér do portu HDMI, napájený z USB.</p>`,
   lab:'wizard', labTitle:'Průvodce výběrem', labHint:'Odpovězte na dvě otázky.',
   key:'Nejlevnější cesta k bezdrátovému prezentování vede přes HDMI adaptér za pár stovek, ne přes nový projektor.'}
 ],
 tasks:[
  {q:"Do učebny s projektorem bez Wi-Fi chodí učitelé s notebooky s Windows, dva mají MacBook a část žáků pracuje na tabletech s Androidem. Navrhněte řešení a zdůvodněte volbu.",
   s:"<p><b>Doporučené řešení: multiplatformní přijímač typu ShareLink nebo adaptér s podporou EzCast.</b></p><p><b>Proč ne jednoúčelové řešení:</b> Apple TV by odřízla Windows i Android, Miracast zase nefunguje se zařízeními Apple. Při téhle skladbě zařízení by kterákoli jednostranná volba znamenala, že část lidí prezentovat nemůže.</p><p><b>Projektor měnit netřeba.</b> Přijímač se zapojí do portu HDMI a napájí se z USB. Vyjde na zlomek ceny nového projektoru.</p><p><b>Výhoda navíc:</b> ShareLink zobrazí až čtyři zařízení současně a nabízí režim moderátora — což se hodí zrovna při skupinové práci žáků, kdy každá skupina ukazuje svůj výstup.</p><p><b>Na co si dát pozor:</b> ve škole plné Wi-Fi sítí hrozí rušení. Před nákupem je rozumné vyzkoušet kus přímo v té učebně, ne v prázdné kanceláři.</p>"},
  {q:"Proč se Miracast připojuje přímo mezi zařízeními, kdežto Chromecast přes síť Wi-Fi? Jaké praktické důsledky to má pro použití ve škole?",
   s:"<p><b>Je to důsledek toho, k čemu byly navržené.</b></p><p><b>Miracast</b> vznikl jako náhrada kabelu. Vytvoří přímé spojení mezi dvěma zařízeními, funguje kdekoli a bez správce sítě. Zato umí jediné — zrcadlit displej.</p><p><b>Chromecast</b> vznikl pro streamování. Připojí se do sítě a obsah si stáhne sám z internetu, takže telefon slouží jen jako dálkové ovládání a může se mezitím vybít nebo odejít pryč.</p><p><b>Praktické důsledky ve škole:</b></p><p><b>Pro Miracast</b> mluví nezávislost na síti — funguje i při výpadku internetu a nevyžaduje domlouvání se správcem sítě. To je ve školním prostředí velká výhoda.</p><p><b>Proti Chromecastu</b> mluví, že školní sítě často oddělují zařízení od sebe kvůli bezpečnosti, takže se navzájem „nevidí“. Pak Chromecast nefunguje, dokud správce neudělá výjimku.</p><p><b>Pro Chromecast</b> naopak mluví možnost pustit video z internetu bez zatížení notebooku a bez toho, aby se na plátně objevovaly notifikace přednášejícího.</p>"}
 ],
 questions:[
  {t:'choice',q:'Která technologie je otevřený standard podporovaný Androidem a Windows?',
   o:['AirPlay','Intel WiDi','Miracast','ShareLink'],c:2,
   e:'Miracast vznikl pod Wi-Fi Alliance jako otevřená alternativa k řešením vázaným na jednoho výrobce.'},
  {t:'text',q:'Kolik zařízení zobrazí ShareLink současně na jedné obrazovce?',a:['4','čtyři'],
   e:'Čtyři. Navíc nabízí režim moderátora, který určuje, čí obraz se zobrazí.'},
  {t:'choice',q:'Čím se Chromecast liší od Miracastu?',
   o:['Nepotřebuje port HDMI','Připojuje se přes síť Wi-Fi, ne přímo mezi zařízeními','Funguje jen se zařízeními Apple','Přenáší obraz bez zvuku'],c:1,
   e:'Chromecast se připojí do sítě a dokáže obsah stahovat sám z internetu. Miracast tvoří přímé spojení mezi dvěma zařízeními.'}
 ],
 recap:[
  '<b>Přímé spojení</b> (Miracast, WiDi) funguje i bez sítě, <b>přes Wi-Fi</b> (AirPlay, Chromecast) potřebuje infrastrukturu.',
  '<b>AirPlay</b> patří k zařízením Apple a jede přes společnou Wi-Fi.',
  '<b>Miracast</b> je otevřený standard pro Android 4.2+ a Windows 8.1+.',
  '<b>Chromecast</b> umí obsah načítat rovnou z internetu, ne jen zrcadlit.',
  '<b>ShareLink</b> zobrazí až čtyři zařízení najednou a nabízí režim moderátora.',
  '<b>Starší projektor</b> stačí doplnit adaptérem do HDMI, není nutné ho měnit.'
 ]
},

{
 id:10, mins:20, title:'Bezpečnost a komprimace', sub:'Malware, phishing a komprimační algoritmy',
 blurb:'Co počítači hrozí a jak zmenšit soubory bez ztráty dat.',
 sections:[
  {t:'Škodlivý software', html:`
   <p><strong>Malware</strong> je souhrnný název pro škodlivé programy. <strong>Adware</strong> zobrazuje reklamu, <strong>spyware</strong> sleduje uživatele, <strong>virus</strong> se šíří kopírováním do dalších souborů.</p>
   <p><strong>Trojský kůň</strong> se tváří jako užitečný program. Podle toho, co uvnitř skrývá, jde o keylogger, sniffer, backdoor nebo spouštěč ransomwaru.</p>
   <p>Nákaza se dnes zpravidla neprojeví hned. Útočníkovi nejde o to počítač zničit — chce z něj tiše těžit data, výpočetní výkon nebo výkupné.</p>`,
   facts:{title:'Typy škodlivého softwaru', rows:[
     ['Adware','vnucuje reklamu, mění domovskou stránku prohlížeče'],
     ['Spyware','sleduje činnost a odesílá zjištěné údaje třetí straně'],
     ['Virus','šíří se vkládáním svých kopií do dalších souborů'],
     ['Keylogger','zaznamenává stisky kláves — hesla, čísla karet'],
     ['Backdoor','otevírá útočníkovi vzdálený přístup do počítače'],
     ['Ransomware','zašifruje data a požaduje výkupné za klíč'],
     ['Botnet','zapojí počítač do sítě ovládané útočníkem, obvykle bez vědomí majitele'],
     ['Těžba kryptoměn','zneužívá výkon procesoru, projeví se zpomalením a přehříváním']]},
   key:'Nejúčinnější obranou proti ransomwaru je záloha uložená mimo počítač. Zašifrovaná data se bez klíče obnovit nedají.', keyWarn:true},

  {t:'Jak se chránit', html:`
   <p>Technická opatření tvoří první vrstvu: <strong>firewall</strong> filtruje síťový provoz, <strong>antivirus</strong> hlídá soubory, <strong>aktualizace</strong> zavírají známé díry.</p>
   <p>Druhou a důležitější vrstvou je chování uživatele. Většina úspěšných útoků neprolomí systém, ale přesvědčí člověka, aby otevřel přílohu nebo vyplnil údaje.</p>`,
   facts:{title:'Základní opatření', rows:[
     ['Firewall','filtruje síťový provoz, ve Windows je zabudovaný'],
     ['Antivirus','musí se pravidelně aktualizovat, jinak nové hrozby nepozná'],
     ['Aktualizace systému','zavírají známé bezpečnostní díry — nejčastěji zneužívaná mezera'],
     ['Silné heslo','dlouhé, jedinečné pro každou službu, ideálně ze správce hesel'],
     ['Dvoufázové ověření','i ukradené heslo pak útočníkovi samo o sobě nestačí'],
     ['Záloha','pravidelná a uložená mimo počítač — jediná obrana proti ransomwaru']]},

const WIDGETS={};
const $=(h,s)=>h.querySelector(s);
const $$=(h,s)=>[...h.querySelectorAll(s)];

function fmtTime(s){
  if(s<1) return Math.round(s*1000)+' ms';
  if(s<60) return Math.round(s)+' s';
  if(s<3600){const m=Math.floor(s/60),r=Math.round(s%60);return m+' min'+(r?' '+r+' s':'');}
  const h=Math.floor(s/3600),m=Math.round((s%3600)/60);
  return h+' h'+(m?' '+m+' min':'');
}
function logLine(box,txt,val,cls){
  const d=document.createElement('div');
  d.className='lg'+(cls?' '+cls:'');
  d.innerHTML=`<span>${txt}</span>${val?`<em>${val}</em>`:''}`;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
}

/* ── 1. BITY ──────────────────────────────────────── */
WIDGETS.bits=function(h){
  const P=[128,64,32,16,8,4,2,1];
  let b=[0,0,0,0,0,0,0,0];
  h.innerHTML=`<div class="bits"></div>
    <div class="rd">
      <div class="rd-c"><div class="rd-k">Dvojkově</div><div class="rd-v sm" data-r="bin">00000000</div></div>
      <div class="rd-c"><div class="rd-k">Desítkově</div><div class="rd-v" data-r="dec">0</div></div>
      <div class="rd-c"><div class="rd-k">Hex</div><div class="rd-v" data-r="hex">0x00</div></div>
      <div class="rd-c"><div class="rd-k">Znak ASCII</div><div class="rd-v" data-r="chr">—</div></div>
    </div>
    <div class="brow">
      <button class="btn btn-g btn-s" data-s="0">Vynulovat</button>
      <button class="btn btn-g btn-s" data-s="65">A</button>
      <button class="btn btn-g btn-s" data-s="122">z</button>
      <button class="btn btn-g btn-s" data-s="255">Vše</button>
    </div>`;
  const row=$(h,'.bits'), R=n=>$(h,`[data-r="${n}"]`);
  P.forEach((p,i)=>{
    const el=document.createElement('button');
    el.className='bit'; el.type='button'; el.setAttribute('aria-pressed','false');
    el.setAttribute('aria-label','Bit s vahou '+p);
    el.innerHTML=`<span class="d">0</span><span class="p">${p}</span>`;
    el.onclick=()=>{b[i]=b[i]?0:1;paint();};
    row.appendChild(el);
  });
  function paint(){
    const v=b.reduce((s,x,i)=>s+(x?P[i]:0),0);
    [...row.children].forEach((el,i)=>{
      el.classList.toggle('on',!!b[i]);
      el.setAttribute('aria-pressed',b[i]?'true':'false');
      $(el,'.d').textContent=b[i];
    });
    R('bin').textContent=b.join('');
    R('dec').textContent=v;
    R('hex').textContent='0x'+v.toString(16).toUpperCase().padStart(2,'0');
    const c=(v>=33&&v<=126)?String.fromCharCode(v):(v===32?'mezera':'netisknutelný');
    R('chr').textContent=c; R('chr').classList.toggle('sm',c.length>2);
  }
  $$(h,'[data-s]').forEach(x=>x.onclick=()=>{const n=+x.dataset.s;for(let i=0;i<8;i++)b[i]=(n>>(7-i))&1;paint();});
  paint();
};

WIDGETS.convert=function(h){
  h.innerHTML=`<div class="fields">
      <div class="fld"><label>Desítkové číslo</label><input type="number" min="0" max="1048575" value="13"></div>
      <button class="btn btn-p">Rozepsat</button>
    </div>
    <div class="log-box"><div class="empty">Zadejte číslo a klikněte na Rozepsat.</div></div>
    <div class="res" style="display:none"></div>`;
  const inp=$(h,'input'), box=$(h,'.log-box'), res=$(h,'.res');
  function go(){
    let n=parseInt(inp.value,10);
    if(isNaN(n)||n<0){box.innerHTML='<div class="empty">Zadejte celé nezáporné číslo.</div>';res.style.display='none';return;}
    if(n>1048575)n=1048575;
    box.innerHTML=''; let cur=n;
    if(cur===0) logLine(box,'0 ÷ 2 = 0','zbytek 0');
    while(cur>0){const q=Math.floor(cur/2);logLine(box,cur+' ÷ 2 = '+q,'zbytek '+(cur%2));cur=q;}
    logLine(box,'zbytky čteme odspodu nahoru','','info');
    res.style.display='block';
    res.textContent=n+'₁₀ = '+n.toString(2)+'₂   (hex '+n.toString(16).toUpperCase()+')';
  }
  $(h,'.btn').onclick=go;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go();}};
};

  h.innerHTML=`<div class="fields">
      <div class="fld"><label>Podle výrobce</label><input type="number" min="1" max="100000" value="1"></div>
      <div class="fld"><label>Jednotka</label><select>

    <div class="rd">
      <div class="rd-c"><div class="rd-k">Bajtů</div><div class="rd-v sm" data-r="b">—</div></div>
      <div class="rd-c"><div class="rd-k">Zobrazí systém</div><div class="rd-v sm" data-r="r">—</div></div>
      <div class="rd-c"><div class="rd-k">Zdánlivý rozdíl</div><div class="rd-v sm" data-r="d">—</div></div>
    </div>
    <div class="status-bar" data-r="n"></div>`;
  const inp=$(h,'input'), sel=$(h,'select'), R=n=>$(h,`[data-r="${n}"]`);
  const N={12:['TiB',Math.pow(1024,4)],9:['GiB',Math.pow(1024,3)],6:['MiB',Math.pow(1024,2)]};
  function calc(){
    const v=parseFloat(inp.value), e=+sel.value;
    if(isNaN(v)||v<=0){R('b').textContent=R('r').textContent=R('d').textContent='—';return;}
    const bytes=v*Math.pow(10,e), [u,div]=N[e], real=bytes/div;
    R('b').textContent=bytes.toLocaleString('cs-CZ');
    R('r').textContent=real.toFixed(2).replace('.',',')+' '+u;
    R('d').textContent=(100-(real/v*100)).toFixed(1).replace('.',',')+' %';
    R('n').innerHTML=`<strong>Nikdo nekrade.</strong> Výrobce počítá ×1000, systém ×1024 — a přitom to popisuje stejnou zkratkou.`;
  }
  inp.oninput=calc; sel.onchange=calc; calc();
};

/* ── 4. DOPLŇKOVÝ KÓD ─────────────────────────────── */
WIDGETS.twos=function(h){
  h.innerHTML=`<div class="fields">
      <div class="fld"><label>Číslo (−128 až 127)</label><input type="number" min="-128" max="127" value="-5"></div>
      <button class="btn btn-p">Zakódovat</button>
    </div><div class="out"><div class="empty">Zadejte číslo a klikněte na Zakódovat.</div></div>`;
  const inp=$(h,'input'), out=$(h,'.out');
  const bin=v=>v.toString(2).padStart(8,'0').split('');
  function stage(lbl,dig,cls){
    const s=document.createElement('div'); s.className='stage';
    s.innerHTML=`<div class="stage-l">${lbl}</div>`;
    const r=document.createElement('div'); r.className='brow-c';
    dig.forEach((d,i)=>{
      const c=document.createElement('div');
      c.className='bc'+(cls==='flip'?' flip':'')+(cls==='final'&&i===0?' sign':'');
      c.textContent=d; r.appendChild(c);
    });
    s.appendChild(r); out.appendChild(s);
  }
  function go(){
    const n=parseInt(inp.value,10);
    if(isNaN(n)||n<-128||n>127){out.innerHTML='<div class="empty">Zadejte celé číslo od −128 do 127.</div>';return;}
    out.innerHTML='';
    if(n>=0){
      stage('Kladné číslo se zapíše přímo',bin(n),'final');
      const r=document.createElement('div');r.className='res';r.textContent=n+' → '+bin(n).join('');out.appendChild(r);
      return;
    }
    const abs=Math.abs(n);
    stage('1. Absolutní hodnota '+abs+' dvojkově',bin(abs));
    const neg=bin(abs).map(d=>d==='1'?'0':'1');
    stage('2. Negace všech bitů',neg,'flip');
    const fin=bin((parseInt(neg.join(''),2)+1)&255);
    stage('3. Přičtení jedničky',fin,'final');
    const r=document.createElement('div');r.className='res';
    r.textContent=n+' → '+fin.join('')+'   (první bit 1 = záporné)';
    out.appendChild(r);
  }
  $(h,'.btn').onclick=go;
  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go();}};
};

WIDGETS.overflow=function(h){
  h.innerHTML=`<div class="fields">
      <div class="fld"><label>Šířka registru</label><select data-i="w">
        <option value="4">4 bity</option><option value="8" selected>8 bitů</option><option value="16">16 bitů</option></select></div>
      <div class="fld"><label>Výklad</label><select data-i="s">
        <option value="u" selected>bez znaménka</option><option value="s">se znaménkem</option></select></div>
    </div>
    <div class="brow">
      <button class="btn btn-p" data-c="i1">+ 1</button>
      <button class="btn btn-g" data-c="i50">+ 50</button>
      <button class="btn btn-g" data-c="max">Na maximum</button>
      <button class="btn btn-d" data-c="zero">Vynulovat</button>
    </div>
    <div class="brow-c" data-r="bits" style="margin-bottom:.75rem"></div>
    <div class="rd">
      <div class="rd-c"><div class="rd-k">Hodnota</div><div class="rd-v" data-r="v">0</div></div>
      <div class="rd-c"><div class="rd-k">Rozsah</div><div class="rd-v sm" data-r="rg">—</div></div>
      <div class="rd-c"><div class="rd-k">Přetečení</div><div class="rd-v" data-r="o">0</div></div>
    </div>
    <div class="status-bar" data-r="n">Přičítejte a sledujte, co se stane, až se hodnota do registru přestane vejít.</div>`;
  const g=n=>$(h,`[data-i="${n}"]`), R=n=>$(h,`[data-r="${n}"]`);
  let raw=0,ovf=0;
  const W=()=>+g('w').value;
  function paint(msg,flash){
    const w=W(), signed=g('s').value==='s', mask=Math.pow(2,w)-1;
    raw&=mask;
    const bits=raw.toString(2).padStart(w,'0').split('');
    R('bits').innerHTML='';
    bits.forEach((d,i)=>{
      const c=document.createElement('div');
      c.className='bc'+(flash?' flip':'')+(signed&&i===0&&d==='1'?' sign':'');
      c.textContent=d; R('bits').appendChild(c);
    });
    let v=raw; if(signed&&raw>=Math.pow(2,w-1)) v=raw-Math.pow(2,w);
    R('v').textContent=v;
    R('rg').textContent=signed?(-Math.pow(2,w-1))+' … '+(Math.pow(2,w-1)-1):'0 … '+mask;
    R('o').textContent=ovf;
    if(msg) R('n').innerHTML=msg;
  }
  function add(n){
    const w=W(), mask=Math.pow(2,w)-1, before=raw;
    raw+=n;
    if(raw>mask){
      ovf++; raw&=mask;
      paint(`<strong>Přeteklo.</strong> Hodnota se do ${w} bitů nevešla, přebytečné bity zmizely a čítač se překlopil. Procesor přitom nehlásí chybu — počítá dál se špatným číslem.`,true);
      setTimeout(()=>paint(),700);
    } else { raw&=mask; paint(before===raw?null:''); }
  }
  $(h,'[data-c="i1"]').onclick=()=>add(1);
  $(h,'[data-c="i50"]').onclick=()=>add(50);
  $(h,'[data-c="max"]').onclick=()=>{raw=Math.pow(2,W())-1;paint('Registr je plný. Další přičtení jedničky ho překlopí na nulu.');};
  $(h,'[data-c="zero"]').onclick=()=>{raw=0;ovf=0;paint('Vynulováno.');};
  ['w','s'].forEach(n=>g(n).onchange=()=>{raw=0;ovf=0;paint('');});
  paint();
};

/* ── 7. ARCHITEKTURA — CANVASOVÁ SIMULACE ─────────── */
WIDGETS.arch=function(h){
  h.innerHTML=`<div class="pills">
      <button class="pill on" data-a="vn">Von Neumann</button>
      <button class="pill" data-a="hv">Harvard</button>
    </div>
    <div class="status-bar" data-r="st">Vyberte přenos a sledujte, jak putuje po sběrnici.</div>
    <div class="brow">
      <button class="btn btn-p" data-c="cycle">Spustit celý cyklus ▶</button>
      <button class="btn btn-g" data-c="fetch">Načíst instrukci</button>
      <button class="btn btn-g" data-c="read">Přečíst data</button>
      <button class="btn btn-g" data-c="write">Zapsat data</button>
    </div>
    <div class="log-box" data-r="log"></div>
    <div class="cvs-wrap"><canvas width="560" height="260"></canvas>
      <div class="cvs-hint">Zelený paket = instrukce (jen z paměti do procesoru) · modrý = data (oběma směry)</div></div>
    <div class="hl hl-blue" data-r="alt" style="margin-bottom:0"></div>`;

  const cv=$(h,'canvas'), ctx=cv.getContext('2d');
  const R=n=>$(h,`[data-r="${n}"]`);
  let mode='vn', pkts=[], anim=null, queue=[], busy=false;

  const C={blue:'#1a56db',green:'#16a34a',border:'#bfdbfe',bg:'#eff6ff',
           text:'#111827',sec:'#6b7280',line:'#dbeafe'};

  function box(x,y,w,hh,label,sub,accent){
    ctx.fillStyle=accent?'#f0fdf4':C.bg;
    ctx.strokeStyle=accent?C.green:C.blue;
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(x,y,w,hh,8); ctx.fill(); ctx.stroke();
    ctx.fillStyle=accent?'#14532d':'#1e40af';
    ctx.font='700 14px Inter,sans-serif'; ctx.textAlign='center';
    ctx.fillText(label,x+w/2,y+hh/2-(sub?4:-5));
    if(sub){ctx.fillStyle=C.sec;ctx.font='11px Inter,sans-serif';ctx.fillText(sub,x+w/2,y+hh/2+13);}
  }
  function bus(x1,y,x2,label){
    ctx.strokeStyle='#c7d7ea'; ctx.lineWidth=8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke();
    ctx.fillStyle=C.sec; ctx.font='600 9.5px Inter,sans-serif'; ctx.textAlign='center';
    ctx.fillText(label,(x1+x2)/2,y+22);
  }
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    box(35,95,140,80,'Procesor','řadič + ALU');
    if(mode==='vn'){
      bus(185,135,405,'SPOLEČNÁ SBĚRNICE — OBOUSMĚRNÁ');
      box(415,95,140,80,'Paměť','program i data',true);
    } else {
      bus(185,72,405,'SBĚRNICE INSTRUKCÍ — JEDNOSMĚRNÁ');
      bus(185,198,405,'SBĚRNICE DAT — OBOUSMĚRNÁ');
      box(415,38,140,66,'Paměť','program',true);
      box(415,164,140,66,'Paměť','data',true);
    }
    pkts.forEach(p=>{
      const x=p.from+(p.to-p.from)*p.t;
      ctx.beginPath(); ctx.arc(x,p.y,8,0,Math.PI*2);
      ctx.fillStyle=p.kind==='i'?C.green:C.blue; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    });
  }
  const ALT={
    vn:`${hlIcon('info')}<div><strong>Co simulace ukazuje:</strong> instrukce i data jedou po jedné sběrnici, takže se musí střídat. Načtení instrukce, čtení dat a zápis dat nikdy neproběhnou zároveň — tomu se říká von Neumannovo úzké hrdlo.</div>`,
    hv:`${hlIcon('info')}<div><strong>Co simulace ukazuje:</strong> každý přenos má vlastní cestu, takže instrukce se načítá zároveň s přenosem dat. Zelený paket jede vždy jen z paměti do procesoru, modrý oběma směry — procesor data čte i zapisuje.</div>`
  };

  function spawn(kind,dir){
    const y = mode==='vn' ? 135 : (kind==='i'?72:198);
    const a=195,b=395;
    pkts.push({kind,y,from:dir==='in'?b:a,to:dir==='in'?a:b,t:0});
  }
  function run(){
    if(anim) return;
    const step=()=>{
      let alive=false;
      pkts.forEach(p=>{p.t=Math.min(1,p.t+0.022);if(p.t<1)alive=true;});
      draw();
      if(alive){anim=requestAnimationFrame(step);}
      else{pkts=[];anim=null;draw();busy=false;nextInQueue();}
    };
    anim=requestAnimationFrame(step);
  }
  const ACTS={
    fetch:{kind:'i',dir:'in',t:'Načtení instrukce',d:'z paměti do procesoru'},
    read:{kind:'d',dir:'in',t:'Čtení dat',d:'z paměti do procesoru'},
    write:{kind:'d',dir:'out',t:'Zápis dat',d:'z procesoru do paměti'}
  };
  function fire(name,parallelWith){
    const a=ACTS[name];
    R('st').innerHTML=`<strong>${a.t}</strong> — ${a.d}`;
    logLine(R('log'),a.t,a.d,a.kind==='i'?'ok':'info');
    spawn(a.kind,a.dir);
    if(parallelWith){
      const p=ACTS[parallelWith];
      logLine(R('log'),p.t+' (souběžně)',p.d,'info');
      spawn(p.kind,p.dir);
    }
    busy=true; run();
  }
  function nextInQueue(){
    if(!queue.length) return;
    const item=queue.shift();
    fire(item[0],item[1]);
  }
  function act(name){
    if(busy) return;
    queue=[]; fire(name);
  }
  $(h,'[data-c="fetch"]').onclick=()=>act('fetch');
  $(h,'[data-c="read"]').onclick=()=>act('read');
  $(h,'[data-c="write"]').onclick=()=>act('write');
  $(h,'[data-c="cycle"]').onclick=()=>{
    if(busy) return;
    R('log').innerHTML='';
    if(mode==='vn'){
      queue=[['read'],['write']];
      logLine(R('log'),'Cyklus na společné sběrnici','tři přenosy za sebou','warn');
      fire('fetch');
    } else {
      queue=[['read']];
      logLine(R('log'),'Cyklus na oddělených sběrnicích','instrukce a data zároveň','ok');
      fire('fetch','write');
    }
  };
  $$(h,'[data-a]').forEach(b=>b.onclick=()=>{
    if(anim){cancelAnimationFrame(anim);anim=null;}
    busy=false;
    mode=b.dataset.a;
    $$(h,'[data-a]').forEach(x=>x.classList.toggle('on',x===b));
    pkts=[];queue=[];R('log').innerHTML='';
    R('alt').innerHTML=ALT[mode];
    R('st').innerHTML=mode==='vn'
      ? 'Jedna sběrnice pro všechno. Přenosy se musí střídat.'
      : 'Dvě sběrnice. Instrukce a data mohou jet zároveň.';
    draw();
  });
  R('alt').innerHTML=ALT.vn;
  if(!ctx.roundRect){ctx.roundRect=function(x,y,w,hh,r){this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+hh,r);this.arcTo(x+w,y+hh,x,y+hh,r);this.arcTo(x,y+hh,x,y,r);this.arcTo(x,y,x+w,y,r);};}
  draw();
};

WIDGETS.scheduler=function(h){
  const PROC=[{n:'Editor',need:6,c:'#16a34a'},{n:'Prohlížeč',need:8,c:'#1a56db'},{n:'Přehrávač',need:4,c:'#d97706'}];
  h.innerHTML=`<div class="fields">
      <div class="fld"><label>Časové kvantum</label><select data-i="q">
        <option value="1">1 jednotka</option><option value="2" selected>2 jednotky</option><option value="4">4 jednotky</option></select></div>
      <button class="btn btn-p" data-c="run">Spustit ▶</button>
      <button class="btn btn-g" data-c="clr">Vymazat</button>
    </div>
    <div class="cvs-wrap" style="background:var(--white);padding:12px"><div class="g"></div></div>
    <div class="status-bar" data-r="n">Tři procesy se dělí o jedno jádro. Plánovač jim střídavě přiděluje časové úseky.</div>`;
  const g=$(h,'.g'), sel=$(h,'[data-i="q"]'), R=n=>$(h,`[data-r="${n}"]`);
  let timer=null;
  function clr(){
    if(timer){clearInterval(timer);timer=null;}
    g.innerHTML=PROC.map(p=>`<div style="display:grid;grid-template-columns:74px 1fr;gap:9px;align-items:center;margin-bottom:6px">
      <div style="font-size:11px;font-family:ui-monospace,Consolas,monospace;color:var(--sec);text-align:right">${p.n}</div>
      <div class="tr" style="display:flex;gap:2px;height:20px"></div></div>`).join('');
  }
  $(h,'[data-c="run"]').onclick=()=>{
    clr();
    const q=+sel.value, left=PROC.map(p=>p.need), plan=[];
    let guard=0;
    while(left.some(v=>v>0)&&guard++<100){
      for(let i=0;i<PROC.length;i++){
        if(left[i]<=0) continue;
        const take=Math.min(q,left[i]);
        for(let k=0;k<take;k++) plan.push(i);
        left[i]-=take;
      }
    }
    const trs=$$(h,'.tr'); let t=0;
    const sw=plan.filter((v,i)=>i>0&&v!==plan[i-1]).length;
    timer=setInterval(()=>{
      if(t>=plan.length){
        clearInterval(timer);timer=null;
        R('n').innerHTML=`<strong>Hotovo za ${plan.length} jednotek času.</strong> Procesor přepnul mezi procesy ${sw}×. Kratší kvantum působí plynuleji, ale každé přepnutí samo o sobě stojí čas.`;
        return;
      }
      const who=plan[t];
      trs.forEach((tr,i)=>{
        const c=document.createElement('div');
        c.style.cssText=`flex:1;border-radius:3px;background:${i===who?PROC[i].c:'#dbeafe'}`;
        tr.appendChild(c);
      });
      t++;
    },170);
  };
  $(h,'[data-c="clr"]').onclick=()=>{clr();R('n').textContent='Tři procesy se dělí o jedno jádro. Plánovač jim střídavě přiděluje časové úseky.';};
  clr();
};

    key:`<svg class="hl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="15" r="5"/><line x1="12.22" y1="11.22" x2="22" y2="2"/><line x1="22" y1="2" x2="22" y2="7"/><line x1="18" y1="2" x2="18" y2="7"/></svg>`
  };
  return i[t]||i.info;
}

/* ══════════════════════════════════════════════════════
   LEKCE — z obsahu kapitol + závěrečný kvíz
══════════════════════════════════════════════════════ */
const BADGES=[
  ['b-data','Data'],['b-arch','Architektura'],['b-hw','Hardware'],['b-bus','Rozhraní'],
  ['b-mem','Paměti'],['b-per','Periferie'],['b-mob','Mobilní'],['b-os','Systémy'],
  ['b-wl','Prezentování'],['b-sec','Bezpečnost']
];
const SHORT=['Data','Architektura','Části PC','Rozhraní','Paměti','Periferie','Mobilní','Systémy','Prezentování','Bezpečnost'];

const LESSONS=CHAPTERS.map((ch,i)=>({
  kind:'chapter', ch,
  badge:BADGES[i][0], bTxt:BADGES[i][1],
  title:ch.title, sub:ch.sub, short:SHORT[i]
}));
LESSONS.push({kind:'quiz',badge:'b-quiz',bTxt:'Závěrečný test',
  title:'Ověřte si znalosti',sub:'15 otázek napříč všemi kapitolami',short:'Test'});

/* ══════════════════════════════════════════════════════
   STAV
══════════════════════════════════════════════════════ */
let curL=0;
const done=new Set();
let qResults=[],qOrder=[],qShuffledOpts=[],qI=0,qDone=false,bestScore=null;

const LS_KEY='apos_kurz_v3';
function saveState(){
  try{localStorage.setItem(LS_KEY,JSON.stringify({curL,done:[...done],qResults,qOrder,bestScore}));}catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY); if(!raw) return false;
    const s=JSON.parse(raw);
    curL=Math.min(s.curL||0,LESSONS.length-1);
    (s.done||[]).forEach(i=>done.add(i));
    qResults=s.qResults||[]; qOrder=s.qOrder||[];
    bestScore=(s.bestScore===undefined?null:s.bestScore);
    return true;
  }catch(e){return false;}
}
function clearState(){try{localStorage.removeItem(LS_KEY);}catch(e){}}

function updateProg(){
  const pct=Math.round(done.size/LESSONS.length*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progPct').textContent=pct+' %';
  document.getElementById('stepsNav').innerHTML=LESSONS.map((l,i)=>{
    const isDone=done.has(i),isActive=i===curL;
    const isLocked=i>0&&!done.has(i-1)&&!isDone&&!isActive;
    const lbl=(isDone?'✓ ':'')+(i<LESSONS.length-1?(i+1)+'. ':'')+l.short;
    return `<button class="sb${isDone?' done':''}${isActive?' active':''}" ${isLocked?'disabled title="Nejdřív dokončete předchozí kapitolu"':''} onclick="goL(${i})">${lbl}</button>`;
  }).join('');
}

function goL(i){
  if(i>0&&!done.has(i-1)&&!done.has(i)&&i!==curL) return;
  curL=i; saveState(); render(); updateProg();
  window.scrollTo({top:0,behavior:'smooth'});
}
function completeNext(){
  done.add(curL); saveState();
  if(curL<LESSONS.length-1){curL++;render();}
  else{renderComplete();}
  updateProg(); saveState();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ══════════════════════════════════════════════════════
   VYKRESLENÍ LEKCE
══════════════════════════════════════════════════════ */
function render(){
  const l=LESSONS[curL], isLast=curL===LESSONS.length-1;
  const body = l.kind==='quiz' ? `<div id="qBox"></div>` : chapterBody(l.ch);
  const meta = l.kind==='quiz'
    ? `<span>◷ asi 10 minut</span><span>✓ 15 otázek</span>${bestScore!==null?`<span>★ nejlépe ${bestScore} %</span>`:''}`
    : `<span>◷ asi ${l.ch.mins} minut</span><span>▤ ${l.ch.sections.length} částí</span><span>✓ ${l.ch.questions.length} otázky</span><span>△ ${(l.ch.tasks||[]).length} úlohy</span>`;

  document.getElementById('lessonCard').innerHTML=
    `<div class="lhead">
       <div class="lbadge ${l.badge}"><div class="dot"></div>${l.bTxt}</div>
       <div class="ltitle">${l.title}</div>
       <div class="lsub">${l.sub}</div>
       <div class="lmeta">${meta}</div>
     </div>
     <div class="lbody">${body}</div>
     <div class="lnav">
       <button class="btn btn-g" ${curL===0?'disabled':''} onclick="goL(${curL-1})">← Zpět</button>
       <span class="lnav-pos">${curL+1} / ${LESSONS.length}</span>
       <button class="btn btn-p" onclick="completeNext()">${isLast?'Dokončit ✓':'Další kapitola →'}</button>
     </div>`;
  setTimeout(()=>postRender(l),40);
}

function chapterBody(ch){
  let h='';
  ch.sections.forEach((s,i)=>{
    h+=`<div class="sechead"><span class="n">${String(i+1).padStart(2,'0')}</span><h3>${s.t}</h3></div>`;
    h+=`<div class="txt">${s.html}</div>`;
    if(s.facts){
      h+=`<table class="info-table"><thead><tr><th colspan="2">${s.facts.title}</th></tr></thead><tbody>`
       + s.facts.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')
       + `</tbody></table>`;
    }
    if(s.lab){
      h+=`<div class="sim">
            <div class="sim-t">${s.labTitle||'Vyzkoušejte si'}</div>
            ${s.labHint?`<div class="sim-h">${s.labHint}</div>`:''}
            <div class="lab" data-lab="${s.lab}"></div>
          </div>`;
    }
    if(s.key){
      h+=`<div class="hl ${s.keyWarn?'hl-amber':'hl-green'}">${hlIcon(s.keyWarn?'warn':'key')}<div>${s.key}</div></div>`;
    }
  });

  h+=`<div class="sechead"><span class="n">Σ</span><h3>Co si odnést</h3></div>
      <ul class="recap-list">${ch.recap.map(r=>`<li><div>${r}</div></li>`).join('')}</ul>`;

  h+=`<div class="sechead"><span class="n">✓</span><h3>Kontrolní otázky</h3></div>
      <div class="chq"></div>`;

  if(ch.tasks&&ch.tasks.length){
    h+=`<div class="sechead"><span class="n">△</span><h3>Úlohy k promyšlení</h3></div>
        <div class="txt"><p>Typ úloh, jaké čekají u zkoušky. Zkuste si odpověď nejdřív zformulovat sami, teprve pak si ji porovnejte s návrhem řešení.</p></div>`
     + ch.tasks.map((t,i)=>`<div class="task">
          <div class="task-q"><b>${i+1}.</b> ${t.q}</div>
          <button class="btn btn-g btn-s" onclick="toggleSol(this)">Zobrazit návrh řešení</button>
          <div class="task-sol" style="display:none">${t.s}</div>
        </div>`).join('');
  }
  return h;
}

function toggleSol(btn){
  const sol=btn.parentElement.querySelector('.task-sol');
  const open=sol.style.display!=='none';
  sol.style.display=open?'none':'block';
  btn.textContent=open?'Zobrazit návrh řešení':'Skrýt řešení';
}

/* ── kontrolní otázky uvnitř kapitoly ── */
function renderChapterQ(ch){
  const host=document.querySelector('.chq'); if(!host) return;
  host.innerHTML='';
  ch.questions.forEach((item,i)=>{
    const box=document.createElement('div');
    box.style.marginBottom='1.25rem';
    box.innerHTML=`<div class="q-text" style="font-size:14px">${i+1}. ${item.q}</div>`;
    const exp=document.createElement('div'); exp.className='q-exp'; exp.style.display='none';
    if(item.t==='choice'){
      const wrap=document.createElement('div'); wrap.className='q-opts';
      item.o.forEach((o,oi)=>{
        const b=document.createElement('button'); b.className='q-opt'; b.type='button'; b.textContent=o;
        b.onclick=()=>{
          if(b.disabled) return;
          if(oi===item.c){
            wrap.querySelectorAll('.q-opt').forEach(x=>x.disabled=true);
            b.classList.add('correct');
            exp.style.display='block'; exp.innerHTML='<strong>Správně. </strong>'+item.e;
          } else {
            b.disabled=true; b.classList.add('wrong');
            exp.style.display='block'; exp.innerHTML='<strong>Tahle možnost to není. </strong>Zkuste jinou.';
          }
        };
        wrap.appendChild(b);
      });
      box.appendChild(wrap);
    } else {
      const row=document.createElement('div'); row.className='q-txt-in';
      const inp=document.createElement('input'); inp.type='text'; inp.placeholder='Vaše odpověď';
      const b=document.createElement('button'); b.className='btn btn-p'; b.textContent='Zkontrolovat';
      const chk=()=>{
        if(inp.disabled||!inp.value.trim()) return;
        if(item.a.some(a=>norm(a)===norm(inp.value))){
          inp.disabled=true; b.disabled=true;
          inp.style.borderColor='var(--green-m)'; inp.style.background='var(--green-bg)';
          exp.style.display='block'; exp.innerHTML='<strong>Správně. </strong>'+item.e;
        } else {
          inp.style.borderColor='var(--red-m)';
          exp.style.display='block'; exp.innerHTML='<strong>Ještě ne. </strong>Zkuste to jinak.';
        }
      };
      b.onclick=chk;
      inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();chk();}};
      row.appendChild(inp); row.appendChild(b); box.appendChild(row);
    }
    box.appendChild(exp);
    host.appendChild(box);
  });
}
function norm(s){return String(s).toLowerCase().trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/^0+(?=\d)/,'');}

/* ══════════════════════════════════════════════════════
   ZÁVĚREČNÝ TEST
══════════════════════════════════════════════════════ */
const QS=[];
CHAPTERS.forEach((ch,ci)=>ch.questions.forEach(q=>QS.push({...q,chn:ci+1,cht:ch.title})));
const QN=15;

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function initQuizOrder(){
  qOrder=shuffle(QS.map((_,i)=>i)).slice(0,QN);
  qShuffledOpts=qOrder.map(qi=>{
    const q=QS[qi];
    return q.t==='choice'?shuffle(q.o.map((_,i)=>i)):null;
  });
  saveState();
}
function curQ(){return QS[qOrder[qI]];}

function postRenderQuiz(){
  qI=0;qDone=false;qResults=[];
  initQuizOrder();
  renderQ();
}

function renderQ(){
  const box=document.getElementById('qBox'); if(!box) return;
  if(qI>=qOrder.length){renderQuizResults(box);return;}
  const q=curQ(), pct=Math.round(qI/qOrder.length*100);
  let inner;
  if(q.t==='choice'){
    const idxs=qShuffledOpts[qI];
    inner=`<div class="q-opts">${idxs.map((oi,pos)=>
      `<button class="q-opt" id="qo${pos}" onclick="qAns(${pos})">${q.o[oi]}</button>`).join('')}</div>`;
  } else {
    inner=`<div class="q-txt-in">
      <input type="text" id="qTxt" placeholder="Vaše odpověď" onkeydown="if(event.key==='Enter'){event.preventDefault();qAnsTxt();}">
      <button class="btn btn-p" id="qTxtBtn" onclick="qAnsTxt()">Odpovědět</button></div>`;
  }
  box.innerHTML=`
    <div class="q-prog-wrap"><div class="q-prog" style="width:${pct}%"></div></div>
    <div class="q-meta"><span>Otázka ${qI+1} z ${qOrder.length}</span><span class="ch">kapitola ${q.chn} — ${q.cht}</span></div>
    <div class="q-text">${q.q}</div>
    ${inner}
    <div id="qExp" class="q-exp" style="display:none"></div>
    <button id="qNxt" class="btn btn-p" style="display:none" onclick="qI++;qDone=false;renderQ()">${qI+1>=qOrder.length?'Zobrazit výsledek →':'Další otázka →'}</button>`;
  if(q.t==='text') setTimeout(()=>{const e=document.getElementById('qTxt');if(e)e.focus();},60);
}

function finishQ(isRight,extra){
  qResults.push(isRight);
  const q=curQ();
  const e=document.getElementById('qExp');
  e.style.display='block';
  e.innerHTML=(isRight?'<strong>Správně. </strong>':'<strong>Chyba. </strong>')+(extra||'')+q.e;
  document.getElementById('qNxt').style.display='inline-block';
  saveState();
}
function qAns(pos){
  if(qDone) return; qDone=true;
  const q=curQ(), idxs=qShuffledOpts[qI];
  const correctPos=idxs.indexOf(q.c);
  idxs.forEach((_,p)=>{
    const b=document.getElementById('qo'+p); b.disabled=true;
    if(p===correctPos) b.classList.add('correct');
    else if(p===pos) b.classList.add('wrong');
  });
  finishQ(pos===correctPos);
}
function qAnsTxt(){
  if(qDone) return;
  const inp=document.getElementById('qTxt');
  if(!inp.value.trim()) return;
  qDone=true;
  const q=curQ();
  const ok=q.a.some(a=>norm(a)===norm(inp.value));
  inp.disabled=true; document.getElementById('qTxtBtn').disabled=true;
  inp.style.borderColor=ok?'var(--green-m)':'var(--red-m)';
  inp.style.background=ok?'var(--green-bg)':'var(--red-bg)';
  finishQ(ok,ok?'':'Správná odpověď je <b>'+q.a[0]+'</b>. ');
}

function renderQuizResults(box){
  const sc=qResults.filter(r=>r).length;
  const pct=Math.round(sc/qOrder.length*100);
  if(bestScore===null||pct>bestScore){bestScore=pct;}
  saveState();
  const wrong=qResults.map((r,i)=>r?null:qOrder[i]).filter(x=>x!==null);
  const grade = pct===100?'Perfektní skóre. Na zkoušku jste připravení.'
    : pct>=80?'Výborně. Zbývají jen drobné mezery.'
    : pct>=60?'Dobrý základ — projděte si chybné odpovědi níže.'
    : pct>=40?'Základ držíte, ale vraťte se ke studijním textům u témat, která drhla.'
    : 'Na opakování je ještě brzy. Začněte studijními texty v Moodlu a vraťte se sem potom.';

  const wrongHTML = wrong.length===0 ? '' : `
    <div style="text-align:left;margin-top:1.25rem">
      <div class="slabel">Chybné odpovědi — správná řešení</div>
      ${wrong.map(qi=>{
        const q=QS[qi];
        const right=q.t==='choice'?q.o[q.c]:q.a[0];
        return `<div style="background:var(--red-bg);border:1px solid var(--red-b);border-radius:var(--r);padding:.75rem 1rem;margin-bottom:.5rem">
          <div style="font-size:13px;font-weight:600;color:var(--red-t);margin-bottom:4px">${q.q}</div>
          <div style="font-size:12px;color:var(--green-m);margin-bottom:4px">✓ ${right}</div>
          <div style="font-size:12px;color:var(--sec);line-height:1.55">${q.e}</div>
          <div style="font-size:11px;color:var(--hint);margin-top:5px">Kapitola ${q.chn} — ${q.cht}</div>
        </div>`;
      }).join('')}
    </div>`;

  box.innerHTML=`<div class="complete">
    <div class="complete-star">★</div>
    <div class="complete-score">${sc} / ${qOrder.length}</div>
    <div style="display:flex;gap:4px;justify-content:center;margin-bottom:.75rem;flex-wrap:wrap">
      ${qResults.map((r,i)=>`<span class="qdot ${r?'ok':'bad'}" title="${QS[qOrder[i]].q.replace(/"/g,'')}"></span>`).join('')}
    </div>
    <div class="complete-sub">${grade}${bestScore!==null?`<br><span style="font-size:12px;color:var(--hint)">Nejlepší výsledek: ${bestScore} %</span>`:''}</div>
    <button class="btn btn-p" onclick="postRenderQuiz()">Zkusit znovu s jinými otázkami</button>
    ${wrongHTML}
  </div>`;
}

/* ══════════════════════════════════════════════════════
   DOKONČENÍ
══════════════════════════════════════════════════════ */
function renderComplete(){
  const sc=qResults.filter(r=>r).length;
  document.getElementById('lessonCard').innerHTML=`
    <div class="lbody"><div class="complete">
      <div class="complete-star">★</div>
      <div class="complete-title">Opakování dokončeno</div>
      ${qResults.length?`<div class="complete-score">${sc} / ${qResults.length} v testu</div>`:''}
      <div class="complete-sub">Prošli jste všech deset kapitol — od reprezentace dat a architektury přes paměti, periferie a operační systémy až po bezpečnost a komprimaci. Pokud vám něco pořád není jasné, vraťte se ke studijním textům v Moodlu.</div>
      <div class="brow" style="justify-content:center">
        <button class="btn btn-g" onclick="goL(0)">Projít znovu od začátku</button>
        <button class="btn btn-p" onclick="goL(LESSONS.length-1)">Zkusit test znovu</button>
      </div>
    </div></div>`;
}

/* ══════════════════════════════════════════════════════
   TOAST + RESET
══════════════════════════════════════════════════════ */
function showToast(msg,ms=2800){
  const t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.style.display='block'; t.style.opacity='1';
  clearTimeout(t._to);
  t._to=setTimeout(()=>{t.style.opacity='0';setTimeout(()=>{t.style.display='none';},300);},ms);
}
function confirmReset(){
  if(done.size===0&&curL===0){showToast('Žádný postup k resetování.');return;}
  if(confirm('Opravdu resetovat celý postup? Tuto akci nelze vrátit zpět.')){
    curL=0;done.clear();qResults=[];qOrder=[];qI=0;bestScore=null;
    clearState();render();updateProg();
    window.scrollTo({top:0,behavior:'smooth'});
    showToast('Postup byl resetován.');
  }
}

/* ══════════════════════════════════════════════════════
   PO VYKRESLENÍ
══════════════════════════════════════════════════════ */
function postRender(l){
  if(l.kind==='quiz'){postRenderQuiz();return;}
  renderChapterQ(l.ch);
  document.querySelectorAll('.lab[data-lab]').forEach(el=>{
    const w=WIDGETS[el.dataset.lab];
    if(w) w(el);
  });
}

/* ══════════════════════════════════════════════════════
   START
══════════════════════════════════════════════════════ */
loadState();
updateProg();
render();
if(done.size>0) showToast('Vítejte zpět. Postup obnoven ('+done.size+'/'+LESSONS.length+').');
</script>
</body>
</html>
